<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>까꿍 디미방 메뉴 생성기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%BD%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#E8845A">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Gowun+Dodum&display=swap');
:root {
  --bg: #FDF8F3;
  --card: #FFFFFF;
  --primary: #E8845A;
  --primary-light: #FFF0E8;
  --secondary: #6BAE8E;
  --secondary-light: #EBF7F2;
  --text: #2D2D2D;
  --text-light: #888;
  --border: #EDE8E0;
  --shadow: 0 4px 20px rgba(0,0,0,0.06);
  --radius: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
header {
  background: white; border-bottom: 1px solid var(--border);
  padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.04);
}
.logo { font-family: 'Gowun Dodum', sans-serif; font-size: 20px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
.logo span { font-size: 24px; }
.btn { padding: 10px 20px; border-radius: 50px; border: none; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 500; transition: all 0.2s; }
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: #d4714a; transform: translateY(-1px); }
.btn-secondary { background: var(--secondary); color: white; }
.btn-secondary:hover { background: #5a9a7c; transform: translateY(-1px); }
.btn-ghost { background: transparent; color: var(--text-light); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--bg); }
.btn-ghost.active { background: #FFF3CD; color: #856404; border-color: #FFCC02; }
.container { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
.week-selector {
  background: white; border-radius: var(--radius); padding: 14px 18px;
  margin-bottom: 20px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.week-btn {
  padding: 8px 14px; border: 1px solid var(--border); border-radius: 8px;
  font-family: 'Noto Sans KR', sans-serif; font-size: 13px; font-weight: 600;
  cursor: pointer; background: white; color: var(--text); transition: all 0.2s; white-space: nowrap;
}
.week-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
.week-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
.days-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-bottom: 24px; }
.day-card { background: white; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); transition: transform 0.2s; }
.day-card:hover { transform: translateY(-2px); }
.day-header { padding: 14px 18px; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: space-between; }
.day-label { font-size: 12px; font-weight: 500; color: var(--text-light); margin-bottom: 2px; }
.day-date { font-size: 18px; font-weight: 700; }
.menu-item { padding: 12px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 10px; position: relative; }
.menu-item:last-child { border-bottom: none; }
.menu-num { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; margin-top: 2px; }
.menu-num.hanwoo { background: #FFF0E8; color: var(--primary); }
.menu-num.chicken { background: #EBF7F2; color: var(--secondary); }
.menu-num.other { background: #F0EEFF; color: #8B6FE8; }
.menu-content { flex: 1; }
.menu-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.menu-ingredients { font-size: 12px; color: var(--text-light); line-height: 1.5; }
.menu-actions { display: flex; gap: 4px; opacity: 1; }
.action-btn { width: 28px; height: 28px; border-radius: 8px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: all 0.15s; }
.action-btn.edit { background: #EBF7F2; color: var(--secondary); }
.action-btn.edit:hover { background: var(--secondary); color: white; }
.action-btn.delete { background: #FFF0E8; color: var(--primary); }
.action-btn.delete:hover { background: var(--primary); color: white; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; align-items: center; justify-content: center; padding: 16px; }
.modal-overlay.active { display: flex; }
.modal { background: white; border-radius: var(--radius); padding: 28px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; animation: modalIn 0.2s ease; }
@keyframes modalIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
.modal-section { margin-bottom: 20px; }
.modal-section label { display: block; font-size: 13px; font-weight: 600; color: var(--text-light); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
.modal-section input, .modal-section textarea { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; font-family: 'Noto Sans KR', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s; }
.modal-section input:focus, .modal-section textarea:focus { border-color: var(--primary); }
.modal-section textarea { resize: vertical; min-height: 80px; }
.suggestions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.suggestion-chip { padding: 5px 10px; border-radius: 50px; font-size: 11.5px; font-weight: 500; cursor: pointer; transition: all 0.15s; border: 1px solid transparent; white-space: nowrap; flex-shrink: 0; }
.suggestion-chip.hanwoo-chip { background: var(--primary-light); color: var(--primary); border-color: #f5c5aa; }
.suggestion-chip.hanwoo-chip:hover { background: var(--primary); color: white; }
.suggestion-chip.chicken-chip { background: var(--secondary-light); color: var(--secondary); border-color: #b8e0ce; }
.suggestion-chip.chicken-chip:hover { background: var(--secondary); color: white; }
.suggestion-chip.other-chip { background: #F0EEFF; color: #8B6FE8; border-color: #d4c8f8; }
.suggestion-chip.other-chip:hover { background: #8B6FE8; color: white; }
/* 재료 칩 에디터 */
.chip-editor {
  min-height: 44px; border: 1px solid var(--border); border-radius: 10px;
  padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  transition: border-color 0.2s; cursor: default;
}
.chip-editor.has-selection { border-color: var(--primary); }
.ingred-chip {
  padding: 5px 12px; border-radius: 50px; font-size: 12px; font-weight: 500;
  cursor: pointer; background: var(--bg); border: 1px solid var(--border);
  color: var(--text); transition: all 0.15s; user-select: none;
  white-space: nowrap; flex-shrink: 0;
}
.ingred-chip:hover { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
.ingred-chip.selected { background: var(--primary); color: white; border-color: var(--primary); }
.chip-text-input {
  border: none; outline: none; font-family: 'Noto Sans KR', sans-serif;
  font-size: 12px; background: transparent; padding: 0 4px; color: white; min-width: 40px;
}
.chip-picker {
  display: none; flex-wrap: wrap; row-gap: 10px; column-gap: 6px; margin-top: 8px; padding: 10px 12px;
  background: var(--bg); border-radius: 10px; border: 1px solid var(--border);
  align-items: flex-start; max-width: 100%; overflow-x: hidden; box-sizing: border-box;
}
.chip-picker.active { display: flex; }
.chip-picker-label { font-size: 11px; color: var(--text-light); width: 100%; margin-bottom: 2px; }
.modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }
.suggest-manage-link {
  display: block; width: 100%; margin-top: 8px; padding: 8px; background: none;
  border: 1px dashed var(--border); border-radius: 8px; color: var(--text-light);
  font-size: 12px; cursor: pointer; text-align: center;
}
.suggest-manage-link:hover { border-color: var(--primary); color: var(--primary); }
.dish-manage-tabs { display: flex; gap: 6px; margin-bottom: 16px; }
.dish-manage-tab {
  flex: 1; padding: 8px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--bg);
  color: var(--text-light); font-size: 13px; font-weight: 600; cursor: pointer;
}
.dish-manage-tab.active { background: var(--primary); border-color: var(--primary); color: white; }
#dishManageList { max-height: 260px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; }
.dish-manage-row {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--border);
}
.dish-manage-row:last-child { border-bottom: none; }
.dish-manage-info { flex: 1; min-width: 0; }
.dish-manage-name { font-size: 13px; font-weight: 600; }
.dish-manage-ing { font-size: 11px; color: var(--text-light); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dish-manage-del {
  flex-shrink: 0; padding: 6px 10px; border-radius: 8px; border: 1px solid #f0b0a0; background: #fff0ec;
  color: #c0402a; font-size: 11px; font-weight: 700; cursor: pointer;
}
.menu-container-hidden { display: none !important; }
.bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; box-shadow: 0 -4px 20px rgba(0,0,0,0.06); }
.bottom-bar-info { font-size: 13px; color: var(--text-light); }
.bottom-bar-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.toast { position: fixed; top: 80px; right: 24px; background: #2D2D2D; color: white; padding: 12px 20px; border-radius: 12px; font-size: 14px; z-index: 300; transform: translateX(120%); transition: transform 0.3s; display: flex; align-items: center; gap: 8px; }
.toast.show { transform: translateX(0); }
.section-title { font-size: 13px; font-weight: 700; color: var(--text-light); text-transform: uppercase; letter-spacing: 1px; padding: 10px 18px 6px; border-bottom: 1px solid var(--border); }
.yusik-item { padding: 10px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.yusik-item:last-child { border-bottom: none; }
.yusik-name { font-size: 13px; font-weight: 600; flex: 1; }
.yusik-ingredients { font-size: 11px; color: var(--text-light); margin-top: 2px; }
.category-tag { font-size: 10px; padding: 2px 7px; border-radius: 4px; font-weight: 600; }
.tag-hanwoo { background: var(--primary-light); color: var(--primary); }
.tag-chicken { background: var(--secondary-light); color: var(--secondary); }
.tag-other { background: #F0EEFF; color: #8B6FE8; }
.history-badge { font-size: 10px; background: #fff3cd; color: #856404; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
pb { padding-bottom: 100px; display: block; }

html, body { overflow-x: hidden; }

@media (max-width: 600px) {
  header { padding: 10px 10px; }
  .logo { font-size: 13px; white-space: nowrap; }
  .logo span { font-size: 16px; }
  header > div { gap: 4px; flex-shrink: 0; }
  header .btn { padding: 6px 8px; font-size: 11px; white-space: nowrap; }

  .container { padding: 12px 10px; }

  .week-selector { padding: 10px 10px; gap: 5px; flex-wrap: wrap; }
  .week-btn { padding: 6px 8px; font-size: 11px; border-radius: 6px; white-space: nowrap; flex-shrink: 0; }

  .bottom-bar { padding: 6px 10px; flex-wrap: nowrap; gap: 4px; }
  .bottom-bar-info { display: none; }
  /* 버튼이 6개가 되면서 한 줄에 안 들어가 오른쪽이 잘렸음 — 두 줄로 흐르게 */
  .bottom-bar-actions { display: flex; flex-wrap: wrap; gap: 4px; width: 100%; }
  .bottom-bar-actions .btn { flex: 1 1 30%; padding: 7px 2px; font-size: 10px; text-align: center; white-space: nowrap; min-width: 0; }

  .history-panel { padding: 12px 10px; margin-bottom: 16px; }
  .days-grid { grid-template-columns: 1fr; gap: 12px; }

  pb { padding-bottom: 60px; display: block; }
}

/* 히스토리 패널 */
.history-panel { background: white; border-radius: var(--radius); padding: 20px 24px; margin-bottom: 24px; box-shadow: var(--shadow); }
.history-panel h4 { font-size: 14px; font-weight: 700; margin-bottom: 12px; color: var(--text-light); }
.history-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.history-tag { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
.history-tag.week1 { background: #ffe0d0; color: #c0532a; }
.history-tag.week2 { background: #ffefd5; color: #a0732a; }
.history-tag.week3 { background: #fff9e0; color: #8a7a2a; }
.history-tag.week4 { background: #f0f8e8; color: #4a7a2a; }
.history-tag.week5 { background: #e8f4f0; color: #2a6a5a; }
/* 저장 전 중복 재료 알림 */
.dup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 9999;
  display: flex; align-items: center; justify-content: center; padding: 18px; }
.dup-box { background: #fff; border-radius: 16px; padding: 20px; width: 100%; max-width: 420px;
  box-shadow: 0 12px 40px rgba(0,0,0,.25); max-height: 84vh; display: flex; flex-direction: column; }
.dup-box h3 { margin: 0 0 6px; font-size: 17px; }
.dup-box .dup-sub { margin: 0 0 14px; font-size: 13px; color: #777; line-height: 1.55; }
.dup-list { overflow-y: auto; border: 1px solid #eee; border-radius: 10px; }
.dup-item { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #f2f2f2; font-size: 14px; }
.dup-item:last-child { border-bottom: none; }
.dup-type { flex-shrink: 0; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 99px; background: #eee; color: #555; }
.dup-type.t-hanwoo { background: var(--primary-light); color: var(--primary); }
.dup-type.t-chicken { background: var(--secondary-light); color: var(--secondary); }
.dup-item b { flex: 1; }
.dup-days { flex-shrink: 0; font-size: 12px; color: #888; }
.dup-btns { display: flex; gap: 8px; margin-top: 14px; }
.dup-btns button { flex: 1; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; border: none; }
.dup-btns .dup-fix { background: var(--primary); color: #fff; }
.dup-btns .dup-go { background: #fff; color: #666; border: 1.5px solid #ddd; }
.dup-btns button:active { transform: scale(.97); filter: brightness(.95); }
/* 재료 사용 이력 배지 */
.usage-badge { font-size:9px; font-weight:700; padding:1px 5px; border-radius:99px; margin-left:2px; white-space:nowrap; }
.usage-badge.recent { background:#FFE8E0; color:#c2410c; }
.usage-badge.old { background:#EEF2F7; color:#64748b; }
/* 재료 준비 목록 */
.shop-head { font-size:12px; font-weight:700; color:var(--primary); margin:0 0 6px; }
.shop-row { display:flex; align-items:center; gap:8px; padding:8px 10px; border-bottom:1px solid #f1f1f1; font-size:13px; }
.shop-row:last-child { border-bottom:none; }
.shop-row b { flex:1; }
.shop-days { font-size:11px; color:#888; }
.shop-cnt { font-size:11px; font-weight:700; color:#a06a00; background:#FFF6E5; padding:2px 7px; border-radius:99px; }
/* 재료 과다 알림 */
.heavy-item { padding:10px 12px; border-bottom:1px solid #f2f2f2; }
.heavy-item:last-child { border-bottom:none; }
.heavy-top { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:5px; }
.heavy-flag { font-size:11px; font-weight:700; padding:2px 7px; border-radius:99px; background:#FFF6E5; color:#a06a00; }
.heavy-flag.warn { background:#FFE8E0; color:#c2410c; }
.heavy-ing { font-size:13px; color:#333; line-height:1.5; }
.heavy-note { font-size:11px; color:#c2410c; margin-top:4px; font-weight:600; }
/* 성분표 */
.nut-menu { padding:10px 0; border-bottom:1px solid #f1f1f1; }
.nut-menu:last-child { border-bottom:none; }
.nut-head { font-size:13px; font-weight:700; margin-bottom:6px; }
.nut-vol { font-size:11px; color:#888; margin:6px 0 4px; }
.nut-rows { display:flex; flex-wrap:wrap; gap:5px; }
.nut-chip { font-size:12px; background:#F4F8FB; border:1px solid #dbe7f0; border-radius:99px; padding:3px 9px; }
.nut-chip b { font-weight:700; }
.nut-total { font-size:12px; font-weight:700; color:#1d6fa5; background:#EAF6FF; border-radius:99px; padding:3px 9px; }
.nut-unknown { font-size:11px; color:#c2410c; margin-top:6px; font-weight:600; }
.nut-warn { margin-top:12px; padding:10px 12px; background:#FFF6E5; border:1px solid #f0c86a; border-radius:10px; font-size:12px; color:#7a5300; line-height:1.6; }
.nut-warn span { opacity:.85; }
.nut-slice { font-size:12px; color:#1d6fa5; margin-top:5px; background:#EAF6FF; border-radius:8px; padding:5px 9px; }
/* 영양성분 */
.nf-menu { padding:12px 0; border-bottom:1px solid #f1f1f1; }
.nf-menu:last-child { border-bottom:none; }
.nf-head { font-size:13px; font-weight:700; margin-bottom:8px; }
.nf-table { width:100%; border-collapse:collapse; font-size:11px; }
.nf-table th, .nf-table td { border:1px solid #eee; padding:4px 3px; text-align:center; }
.nf-table th { background:#F7F5FF; font-weight:700; color:#6d4bc9; }
.nf-table th span { display:block; font-size:9px; font-weight:400; opacity:.7; }
.nf-row-h { background:#FAFAFA; font-weight:700; white-space:nowrap; }
.nf-row-h span { display:block; font-size:9px; font-weight:400; color:#999; }
/* 표가 넓어 화면을 넘길 수 있으므로 모달은 화면 안에 가두고 표만 안에서 스크롤 */
#nutritionFactsModal .modal { max-width: min(640px, calc(100vw - 24px)); }
.nf-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.nf-scroll .nf-table { min-width: 400px; }
@media (max-width: 480px) {
  .nf-table { font-size:10px; }
  .nf-table th, .nf-table td { padding:4px 2px; }
}
.nf-pct { display:block; font-size:9px; color:#aaa; font-weight:400; margin-top:1px; }
.nf-pct.hi { color:#d9822b; font-weight:700; }
.nf-note { margin-top:10px; background:#F6FBF4; border:1px solid #dbead4; border-radius:10px; padding:10px 12px; }
.nf-note-h { font-size:11px; font-weight:700; color:#4a7c3f; margin-bottom:7px; }
.nf-note-i { font-size:12px; line-height:1.55; margin-bottom:6px; }
.nf-note-i:last-child { margin-bottom:0; }
.nf-note-i b { display:block; color:#2f5d27; }
.nf-note-i span { color:#5a6b55; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<header>
  <div class="logo"><span>🍚</span> 까꿍 디미방</div>
  <div style="display:flex;gap:8px">
    <button class="btn btn-ghost" onclick="copyLastWeek()" title="가장 최근 저장된 주 메뉴를 그대로 가져와서 이번 주 편집을 시작해요">📋 지난주 그대로</button>
    <button class="btn btn-primary" onclick="generateMenu()">🎲 메뉴 새로 뽑기</button>
  </div>
</header>

<div class="container">
  <!-- 숨겨진 주차값 (기존 코드 호환) -->
  <input type="hidden" id="weekStart">
  <input type="hidden" id="weekEnd">
  <div class="week-selector" id="weekBtns"></div>

  <div id="historyPanel" style="display:block" class="history-panel">
    <div id="historyQuickButtons" style="display:none"></div>
    <select id="historyWeekSelect" style="display:none"></select>
    <div id="historyContent" style="font-size:13px;color:var(--text-light);"></div>
  </div>

  <div id="menuContainer" class="menu-container-hidden">
    <div style="text-align:center;padding:60px 20px;color:var(--text-light)">
      <div style="font-size:48px;margin-bottom:16px">🌿</div>
      <p style="font-size:15px;margin-bottom:20px">날짜를 선택하고 메뉴를 생성해보세요!</p>
      <button class="btn btn-primary" onclick="generateMenu()">✨ 지금 생성하기</button>
    </div>
  </div>
  <pb></pb>

// ===== 재료 궁합 확인 =====
// 궁합표(PAIRINGS)는 원래 "주재료 → 어울리는 서브재료" 방향으로만 짜여있는데, 여기서는
// 아무 재료 둘을 골라도(양방향으로) 확인할 수 있게 함. 궁합표에 직접 연결이 없으면 실제
// 반찬(YUSIK_MAIN/YUSIK_SOUP)에 같이 쓰인 적 있는지도 참고로 보여줌.
function buildAllIngredientList() {
  const set = new Set();
  ['hanwoo', 'chicken', 'protein3'].forEach(cat => {
    Object.keys(PAIRINGS[cat]).forEach(k => set.add(k));
    Object.values(PAIRINGS[cat]).forEach(subs => subs.forEach(s => set.add(s)));
  });
  YUSIK_MAIN.forEach(m => m.ingredients.split(',').forEach(i => set.add(i.trim())));
  YUSIK_SOUP.forEach(s => s.ingredients.split(',').forEach(i => set.add(i.trim())));
  return [...set].filter(Boolean).sort((a, b) => a.localeCompare(b, 'ko'));
}
const ALL_INGREDIENTS = buildAllIngredientList();

const pairKey = (a, b) => [a, b].sort().join('|');
let customPairings = new Map(); // pairKey → {verdict, note}

async function loadCustomPairings() {
  if (customPairingsLoaded) return;
  try {
    const res = await fetch(`${SB_URL}/rest/v1/kkakung_custom_pairings?select=id,verdict,note`, { headers: SB_HEADERS });
    if (res.ok) {
      const rows = await res.json();
      rows.forEach(r => customPairings.set(r.id, { verdict: r.verdict, note: r.note }));
    }
    customPairingsLoaded = true;
  } catch (e) { console.warn('궁합 직접등록 데이터 로드 실패', e); }
}

    : '<span style="font-size:12px;color:#999;">검색 결과 없음</span>';
}

// a·b 순서로 직접 등록한 값 → 궁합표(양방향) → 실제 반찬에 같이 쓰인 적 있는지 순으로 확인
function checkPairing(a, b) {
  const custom = customPairings.get(pairKey(a, b));
  if (custom) return { level: custom.verdict === 'good' ? 'customGood' : 'customAvoid', reason: custom.note || '직접 등록한 궁합' };

  const catNames = { hanwoo: '한우', chicken: '닭가슴살', protein3: '기타단백질' };
  for (const cat of ['hanwoo', 'chicken', 'protein3']) {
    const pg = PAIRINGS[cat];
    if (pg[a] && pg[a].includes(b)) return { level: 'match', reason: `${catNames[cat]} 궁합표: ${a} + ${b}` };
    if (pg[b] && pg[b].includes(a)) return { level: 'match', reason: `${catNames[cat]} 궁합표: ${b} + ${a}` };
  }
  const dishes = [...YUSIK_MAIN, ...YUSIK_SOUP].filter(m => {
    const ings = m.ingredients.split(',').map(s => s.trim());
    return ings.includes(a) && ings.includes(b);
  });
  if (dishes.length) return { level: 'coOccur', reason: `"${dishes[0].name}" 등 ${dishes.length}개 반찬에 함께 쓰임` };
  return { level: 'none', reason: '' };
}

function checkAndShowPairing() {
  const a = pairSelected[1], b = pairSelected[2];
  const box = document.getElementById('pairingResult');
  if (!a || !b) { box.style.display = 'none'; return; }
  box.style.display = '';
  if (a === b) {
    box.innerHTML = `<div style="padding:12px;background:#f5f5f5;border-radius:10px;color:#888;font-weight:600;">같은 재료예요</div>`;
    return;
  }
  const result = checkPairing(a, b);
  if (result.level === 'match') {
    box.innerHTML = `<div style="padding:12px;background:#e8f4e8;border-radius:10px;color:#2a7a2a;font-weight:700;">✅ 궁합 좋음 — ${result.reason}</div>`;
  } else if (result.level === 'customGood') {
    box.innerHTML = `<div style="padding:12px;background:#e8f4e8;border-radius:10px;color:#2a7a2a;font-weight:700;">✅ 궁합 좋음 (직접 등록) — ${result.reason}</div>`;
  } else if (result.level === 'customAvoid') {
    box.innerHTML = `<div style="padding:12px;background:#fdeaea;border-radius:10px;color:#b03030;font-weight:700;">⚠️ 궁합 별로 (직접 등록) — ${result.reason}</div>`;
  } else if (result.level === 'coOccur') {
    box.innerHTML = `<div style="padding:12px;background:#fff3e0;border-radius:10px;color:#b06000;font-weight:700;">🔶 함께 쓰인 반찬 있음 — ${result.reason}</div>`;
  } else {
    box.innerHTML = `<div style="padding:12px;background:#f5f5f5;border-radius:10px;color:#888;font-weight:600;margin-bottom:8px;">❔ 궁합 데이터 없음 — 안 좋다는 뜻이 아니라 아직 확인된 조합이 없다는 뜻이에요</div>`
      + `<div style="display:flex;gap:8px;">`
      + `<button class="btn btn-ghost" style="flex:1;background:#e8f4e8;color:#2a7a2a;border-color:#8ac08a;" onclick="saveCustomPairingUI('good')">👍 궁합 좋음으로 등록</button>`
      + `<button class="btn btn-ghost" style="flex:1;background:#fdeaea;color:#b03030;border-color:#e8a0a0;" onclick="saveCustomPairingUI('avoid')">👎 별로예요로 등록</button>`
      + `</div>`;
  }
}

async function saveCustomPairingUI(verdict) {
  const a = pairSelected[1], b = pairSelected[2];

  const result = await serverWrite({ action: 'save_pairing', ingredient_a: a, ingredient_b: b, verdict });

  showToast('✅ 궁합 등록됐어요 — 다른 기기에서도 바로 보여요');
  checkAndShowPairing();
}

// ===== 서버 경유 쓰기 (RLS 보호 · 비밀번호 인증) =====
// 읽기(SELECT)는 anon으로 그대로, 쓰기/삭제만 /api/save-menu(service_role)로.
function getMenuPassword(force) {
  // 기기당 최초 1회만 입력 → localStorage에 저장돼 자동 유지 (브라우저 꺼도 유지)
  let pw = localStorage.getItem('menu_pw');
  if (!pw || force) {
    pw = prompt('메뉴 편집 비밀번호 (최초 1회만 · 이 기기에서 자동 저장됩니다)');
    if (pw) localStorage.setItem('menu_pw', pw);
  }
  return pw;
}
async function serverWrite(payload) {
  const pw = getMenuPassword();
  if (!pw) return { ok: false, error: '비밀번호 미입력' };
  try {
    const res = await fetch('/api/save-menu', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...payload, password: pw })
    });
    const d = await res.json().catch(() => ({}));
    if (res.status === 401) { localStorage.removeItem('menu_pw'); return { ok: false, error: d.error || '비밀번호 오류' }; }
    if (!res.ok || !d.ok) return { ok: false, error: d.error || ('HTTP ' + res.status) };
    return { ok: true };
  } catch (e) { return { ok: false, error: e.message }; }
}

    }));

    console.warn('Supabase load failed, fallback to cache', e);
    try {
      const cached = JSON.parse(localStorage.getItem(CACHE_KEY));
      if (cached && cached._serverOk) return { ...cached, _serverOk: false };
    } catch(e2) {}
    // ★ 빈 history로 fallback 안 함 (덮어쓰기 방지). 명시적 에러 표시.
    return { yusik: [], yushik_veggie: [], _serverOk: false, _loadFailed: true };
  }
}

// 한 주 단위 upsert. 단일 row로 저장 → 다른 주 데이터 영향 없음.
async function saveWeek(weekKey, yusikMenus, veggie, schedule) {
  if (!weekKey || !/^\d{4}-\d{2}-\d{2}$/.test(weekKey)) {
    alert('저장 실패: weekKey 형식 오류 (' + weekKey + ')');
    return false;
  }
  const body = {
    id: weekKey,
    yusik: { menus: yusikMenus || [], schedule: schedule || null },
    yushik_veggie: {
      hanwoo: (veggie && veggie.hanwoo) || [],
      chicken: (veggie && veggie.chicken) || [],
      p3: (veggie && veggie.p3) || []
    },
    updated_at: new Date().toISOString()
  };
  const r = await serverWrite({ action: 'upsert', row: body });
  if (!r.ok) {
    alert('저장 실패: ' + r.error);
    return false;
  }
  // 성공 → 4주 초과 row 정리
  cleanupOldWeeks();
  return true;
}

async function cleanupOldWeeks() {
  try {
    const res = await fetch(`${SB_URL}/rest/v1/kkakung_history?id=like.20*&select=id&order=id.desc`, { headers: SB_HEADERS });
    if (!res.ok) return;
    const rows = await res.json();
    if (rows.length <= MAX_WEEKS) return;
    for (const r of rows.slice(MAX_WEEKS)) {
      await serverWrite({ action: 'delete', id: r.id }).catch(()=>{});
    }
  } catch(e) { console.warn('cleanup failed', e); }
}

// Legacy compat: saveHistory(h) — h.yusik의 마지막 항목 + 같은 weekKey의 yushik_veggie를 saveWeek로
async function saveHistory(h) {

  if (h._loadFailed) {
    alert('서버 연결 실패 상태에서는 저장할 수 없습니다. 새로고침 후 재시도하세요.');
    return false;
  }
  const last = h.yusik[h.yusik.length - 1];
  if (!last.weekKey) {
    console.error('saveHistory: weekKey 없음');
    return false;
  }
  const veg = h.yushik_veggie.find(w => w.weekKey === last.weekKey);
  const ok = await saveWeek(last.weekKey, last.menus || [], veg);
  if (ok) localStorage.setItem(CACHE_KEY, JSON.stringify({ ...h, _serverOk: true }));
  return ok;
}

async function recordThisWeek(weekKey, menuData) {
  const yusikMenus = [];
  menuData.forEach(day => {
    if (day.type === 'yusik') {
      day.items.forEach(item => yusikMenus.push({ name: item.name, ingredients: item.ingredients }));
    }
  });
  const usedHanwoo = [], usedChicken = [], usedP3 = [];
  menuData.forEach(day => {
    if (day.type === 'yushik') {
      day.menus.forEach(m => {
        if (m.type === 'hanwoo') usedHanwoo.push(`${m.mainVeggie}|${m.subVeggie || ''}`);
        else if (m.type === 'chicken') usedChicken.push(`${m.mainVeggie}|${m.subVeggie || ''}`);
        else usedP3.push(`${m.mainProtein}|${m.subVeggie || ''}`);
      });
    }
  });
  // schedule: 일주일 전체 일자별 메뉴를 그대로 저장 (요일 정확 표시용)
  const schedule = menuData.map(day => ({
    date: (day.date instanceof Date) ? day.date.toISOString().slice(0, 10) : day.date,
    type: day.type,
    ...(day.removed ? { removed: true } : {}),
    items: day.type === 'yusik' ? (day.items || []).map(it => ({ name: it.name, ingredients: it.ingredients, origin: it.origin || '' })) : null,
    soup: day.type === 'yusik' ? { name: day.soup?.name || '', ingredients: day.soup?.ingredients || '', origin: day.soup?.origin || '' } : null,
    menus: day.type === 'yushik' ? (day.menus || []).map(m => ({
      type: m.type,
      name: m.displayName || m.name,
      ingredients: m.ingredients,
      mainVeggie: m.mainVeggie || m.mainProtein,
      subVeggie: m.subVeggie
    })) : null
  }));
  // 단일 주차 row upsert — 다른 주 데이터에 영향 없음
  const ok = await saveWeek(weekKey, yusikMenus, { hanwoo: usedHanwoo, chicken: usedChicken, p3: usedP3 }, schedule);
  // 캐시 갱신 (다음 loadHistory 호출 시 최신 반영 위해)
  if (ok) {
    try {
      const cached = JSON.parse(localStorage.getItem(CACHE_KEY)) || { yusik: [], yushik_veggie: [] };
      const yi = (cached.yusik || []).findIndex(w => w.weekKey === weekKey);
      const newYusik = { weekKey, menus: yusikMenus };
      if (yi >= 0) cached.yusik[yi] = newYusik; else (cached.yusik = cached.yusik || []).push(newYusik);
      const vi = (cached.yushik_veggie || []).findIndex(w => w.weekKey === weekKey);
      const newVeg = { weekKey, hanwoo: usedHanwoo, chicken: usedChicken, p3: usedP3 };
      if (vi >= 0) cached.yushik_veggie[vi] = newVeg; else (cached.yushik_veggie = cached.yushik_veggie || []).push(newVeg);
      cached._serverOk = true;
      localStorage.setItem(CACHE_KEY, JSON.stringify(cached));
    } catch(e) {}
  }
}

// ===== 메뉴 생성 로직 =====
function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

// 이유식 재료 — 고정 재료 제거 후 단백질 + 야채만 표시
// 야채가 0개이면 양파도 표시 (데이터가 양파뿐인 경우 빈 화면 방지)
function normalizeYushikIngredients(str, type) {
  const items = (str || '').split(',').map(s => s.trim()).filter(Boolean);
  const proteins = type === 'hanwoo' ? ['한우'] : type === 'chicken' ? ['닭가슴살','닭고기'] : [];
  const broth = type === 'hanwoo' ? '한우육수' : type === 'chicken' ? '닭육수' : '';
  const alwaysHide = [broth, '채소상탕'].filter(Boolean); // 항상 숨김 (표시 가치 없음)
  const seen = new Set();
  const protein = [], veggie = [], softHidden = [];
  for (const x of items) {
    if (!x || seen.has(x) || alwaysHide.includes(x)) continue;
    seen.add(x);
    if (proteins.includes(x)) protein.push(x);
    else if (x === '양파') softHidden.push(x); // 야채 있으면 숨기고, 없으면 표시
    else veggie.push(x);
  }
  if (proteins.length && !protein.length) protein.push(proteins[0]);
  const finalVeggie = veggie.length > 0 ? veggie : softHidden;
  return [...protein, ...finalVeggie].join(', ');
}

function pickExcluding(pool, exclude) {
  const filtered = pool.filter(x => !exclude.includes(x));
  if (filtered.length === 0) return pool[Math.floor(Math.random() * pool.length)]; // 부득이하게
  return filtered[Math.floor(Math.random() * filtered.length)];
}

// 반찬 5개를 고를 때 같은 재료(당근이든 다른 채소든 전부 해당)가 너무 많은 반찬에 몰리지 않게 함.
// 재료 하나당 최대 등장 횟수(기본 3/5)를 넘기는 반찬은 건너뜀 — 예전엔 그냥 섞어서 앞 5개를
// 잘랐는데, 재료 풀에서 당근처럼 여러 반찬에 공통으로 들어가는 재료 비중이 높아서 5개 중 4~5개에
// 같은 재료가 몰리는 경우가 실제로 있었음.
function pickBanchanSet(pool, count = 5, maxPerIngredient = 3) {
  const shuffled = shuffle(pool);
  const picked = [];
  const ingredientCount = {};
  const ingredientsOf = item => item.ingredients.split(',').map(s => s.trim()).filter(Boolean);

  for (const item of shuffled) {
    if (picked.length >= count) break;
    const ings = ingredientsOf(item);
    const wouldExceed = ings.some(ing => (ingredientCount[ing] || 0) + 1 > maxPerIngredient);
    if (wouldExceed) continue;
    picked.push(item);
    ings.forEach(ing => { ingredientCount[ing] = (ingredientCount[ing] || 0) + 1; });
  }
  // 상한 때문에 못 채웠으면(풀이 작거나 재료가 겹치는 반찬뿐인 경우) 남은 자리는 상한 무시하고 채움
  if (picked.length < count) {
    for (const item of shuffled) {
      if (picked.length >= count) break;
      if (!picked.includes(item)) picked.push(item);
    }
  }
  return picked;
}

function buildYushikMenu(dayIndex, usedThisWeek, prevWeek) {
  // prevWeek.hanwoo/chicken/p3 = ["주재료|서브", ...] 형태의 4주 사용 콤보

  function usedSubsFor(comboList, main) {
    return comboList.filter(c => c.split('|')[0] === main).map(c => c.split('|')[1]);
  }

  // 하루 안에서 이미 등장한 채소(메인+서브 전부) — 한우/닭/기타단백질 세 요리끼리 같은 채소가
  // 겹치는 걸 막는 용도. 예전엔 "직전 요리의 서브재료"만 부분적으로 피했고 메인재료끼리는
  // 아예 비교를 안 해서(예: 한우 요리의 메인이 '당근', 닭 요리의 메인도 독립적으로 '당근'이
  // 뽑힐 수 있었음), 하루 메뉴에 같은 채소가 중복되는 사례가 실제로 있었음.
  const usedToday = new Set();

  // 한우 — 이번 주 내 주재료 중복 방지(주간 겹침) + 당일 중복 방지, 서브는 4주 콤보 기준
  const hwMain = pickExcluding(HANWOO_MAIN_POOL, [...usedThisWeek.hanwoo, ...usedToday]);
  usedThisWeek.hanwoo.push(hwMain);
  usedToday.add(hwMain);
  const hwSubs = PAIRINGS.hanwoo[hwMain] || ['당근','쥬키니호박','감자'];
  const hwUsedSubs = usedSubsFor(prevWeek.hanwoo, hwMain);
  const hwSub = pickExcluding(hwSubs, ['양파', ...hwUsedSubs, ...usedToday]);
  usedToday.add(hwSub);

  // 닭 — 이번 주 주재료 중복 방지 + 당일 중복 방지(한우 메인·서브 포함), 서브는 4주 콤보 기준
  const ckMain = pickExcluding(CHICKEN_MAIN_POOL, [...usedThisWeek.chicken, ...usedToday]);
  usedThisWeek.chicken.push(ckMain);
  usedToday.add(ckMain);
  const ckSubs = PAIRINGS.chicken[ckMain] || ['당근','감자','쥬키니호박'];
  const ckUsedSubs = usedSubsFor(prevWeek.chicken, ckMain);
  const ckSub = pickExcluding(ckSubs, ['양파', ...ckUsedSubs, ...usedToday]);
  usedToday.add(ckSub);

  // 기타단백질 — 이번 주 주재료 중복 방지 + 당일 중복 방지(한우·닭 메인·서브 전부), 서브는 4주 콤보 기준
  const p3Main = pickExcluding(P3_POOL, [...usedThisWeek.p3, ...usedToday]);
  usedThisWeek.p3.push(p3Main);
  usedToday.add(p3Main);
  const p3Subs = PAIRINGS.protein3[p3Main] || ['쥬키니호박','감자','브로콜리'];
  const p3UsedSubs = usedSubsFor(prevWeek.p3, p3Main);
  const p3Sub = pickExcluding(p3Subs, ['양파', ...p3UsedSubs, ...usedToday]);
  usedToday.add(p3Sub);
  // 기타단백질 요리는 한우/닭과 달리 주재료(p3Main)가 채소가 아니라서 베이스 채소를 하나
  // 고정으로 더 넣어왔는데, 그게 무조건 '당근'으로 하드코딩돼 있어서 p3Sub가 하필 당근으로
  // 뽑히면 재료 목록에 "당근, 당근"이 그대로 중복 표시되는 버그가 있었음 — p3Sub뿐 아니라
  // 오늘 이미 쓰인 채소 전부와 안 겹치는 걸로 고름. 후보를 4개로 좁게 잡으면(당근/감자/
  // 쥬키니호박/브로콜리) 한우·닭 요리가 이미 그 4개를 다 써버려서 후보가 고갈되는 경우가 잦아
  // 후보군을 넉넉히 잡음.
  const P3_BASE_CANDIDATES = ['당근','감자','쥬키니호박','브로콜리','양배추','애호박','무','배추','콜리플라워','시금치'];
  const p3Base = P3_BASE_CANDIDATES.find(v => !usedToday.has(v)) || '당근';
  usedToday.add(p3Base);

  return [
    {
      name: `한우 ${hwMain} 죽/무른밥/진밥`,
      displayName: `한우 ${hwMain}`,
      ingredients: `한우, ${hwMain}, ${hwSub}, 한우육수, 양파, 채소상탕`,
      type: 'hanwoo',
      mainVeggie: hwMain, subVeggie: hwSub
    },
    {
      name: `닭가슴살 ${ckMain} 죽/무른밥/진밥`,
      displayName: `닭가슴살 ${ckMain}`,
      ingredients: `닭가슴살, ${ckMain}, ${ckSub}, 닭육수, 양파, 채소상탕`,
      type: 'chicken',
      mainVeggie: ckMain, subVeggie: ckSub
    },
    {
      name: `${p3Main} ${p3Sub} 죽/무른밥/진밥`,
      displayName: `${p3Main} ${p3Sub}`,
      ingredients: `${p3Main}, ${p3Sub}, ${p3Base}, 양파, 채소상탕`,
      type: 'other',
      mainProtein: p3Main, subVeggie: p3Sub
    }
  ];
}

let currentMenu = null;

let editTarget = null;

function getMonday(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  d.setDate(diff);
  return d;
}

// 기준: 일요일 00:00부터 이번주 = 다음 월요일 (토요일에 다음주 메뉴 작성 지원)
function getBaseMonday() {
  const now = new Date();
  if (now.getDay() === 0) { // 일요일 → 내일(월요일)이 이번주
    const next = new Date(now);
    next.setDate(now.getDate() + 1);
    return getMonday(next);
  }
  return getMonday(now);
}

function getWeekMondayByOffset(offset) {
  const base = getBaseMonday();
  base.setDate(base.getDate() + offset * 7);
  return base;
}

function buildWeekButtons() {
  const offsets = [-4, -3, -2, -1, 0, 1];
  const box = document.getElementById('weekBtns');
  if (!box) return;
  const curWk = document.getElementById('weekStart').value;
  box.innerHTML = offsets.map(offset => {
    const mon = getWeekMondayByOffset(offset);
    const wk = formatDate(mon);
    const label = `${mon.getMonth()+1}/${mon.getDate()}`;
    const isActive = wk === curWk;
    return `<button class="week-btn${isActive?' active':''}" onclick="selectWeekBtn('${wk}')" data-wk="${wk}">${label}</button>`;
  }).join('') +
  `<button class="week-btn" onclick="startCompare()" style="margin-left:auto;border-color:rgba(122,36,24,0.4);color:var(--primary);font-weight:700">↔ 전주 비교</button>`;
}

// 현재 weekStart 기준 직전 저장 주차와 비교 모드 진입
async function startCompare() {
  const wk = document.getElementById('weekStart').value;
  if (!wk) { showToast('⚠️ 먼저 주차를 선택해주세요'); return; }
  if (!currentMenu) { showToast('⚠️ 이번 주 메뉴를 먼저 불러와주세요'); return; }
  try {
    const res = await fetch(`${SB_URL}/rest/v1/kkakung_history?id=like.20*&select=id,yusik&order=id.desc`, { headers: SB_HEADERS });
    const rows = await res.json();
    const prevRow = rows.find(r => r.id < wk && r.yusik?.schedule?.length);
    if (!prevRow) { showToast('비교할 이전 저장 주차가 없어요'); return; }

    html += `<button class="btn btn-ghost" onclick="exitHistoryView()" style="padding:5px 12px;font-size:11px">✕ 닫기</button>`;

    html += `<button class="btn btn-ghost" onclick="checkHistoryDupes()" style="width:100%;margin-bottom:10px;font-size:12px;background:rgba(122,36,24,0.08);border:1px solid rgba(122,36,24,0.35);color:var(--primary);font-weight:600">🔍 재료 중복 확인</button>`;
    html += `<div id="histDupeResult" style="margin-bottom:10px"></div>`;
    // 토/일 제외 (type=holiday or day.date가 토/일인 것 제외)
    const EXCLUDE = new Set(['한우','닭가슴살','닭고기','한우육수','닭육수','양파','채소상탕','당근','소금','물']);
    function isWeekend(day) {
      if (!day) return false;
      const d = new Date(day.date);
      return d.getDay() === 0 || d.getDay() === 6;
    }
    function getYushikIngreds(schedule) {
      const set = new Set();
      (schedule||[]).forEach(day => {
        if (day.type !== 'yushik' || day.removed) return;
        (day.menus||[]).forEach(m => {
          normalizeYushikIngredients(m.ingredients||'', m.type)
            .split(',').map(s=>s.trim()).filter(Boolean)
            .forEach(x => { if (!EXCLUDE.has(x)) set.add(x); });
        });
      });
      return set;
    }
    // 주 안에서 반복된 야채만 (2일 이상 등장)
    function getIntraWeekDupes(schedule) {
      const counts = {};
      (schedule||[]).forEach(day => {
        if (day.type !== 'yushik' || day.removed) return;
        (day.menus||[]).forEach(m => {
          normalizeYushikIngredients(m.ingredients||'', m.type)
            .split(',').map(s=>s.trim()).filter(Boolean)
            .forEach(x => { if (!EXCLUDE.has(x)) counts[x] = (counts[x]||0)+1; });
        });
      });
      return Object.entries(counts).filter(([,v])=>v>1).map(([k])=>k);
    }
    const prevDupes = getIntraWeekDupes(prevSchedule);
    const curDupes  = getIntraWeekDupes(currentMenu);

    html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">`;
    html += `<div style="text-align:center;font-size:11px;font-weight:700;padding:6px;background:#f0eae0;border-radius:5px">전주 ${fmtPrev}</div>`;
    html += `<div style="text-align:center;font-size:11px;font-weight:700;padding:6px;background:rgba(139,170,124,0.18);border-radius:5px">이번 주 ${fmtCur}</div>`;
    html += `</div>`;
    html += `<div id="histCompareGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">`;

    const prevFiltered = (prevSchedule||[]).filter(d => !isWeekend(d));
    const curFiltered  = (currentMenu||[]).filter(d => !isWeekend(d));
    const maxLen = Math.max(prevFiltered.length, curFiltered.length);
    for (let i = 0; i < maxLen; i++) {
      html += renderDayCard(prevFiltered[i], '#fdfaf3');
      const cd = curFiltered[i];
      const di = cd ? currentMenu.indexOf(cd) : -1;
      html += cd ? renderEditableDayCard(cd, di >= 0 ? di : i, 'rgba(139,170,124,0.06)') : renderDayCard(null, 'rgba(139,170,124,0.06)');
    }
    html += `</div>`;
    // 주차별 중복 야채 — 중복 있는 경우만 표시
    if (prevDupes.length || curDupes.length) {
      html += `<div style="margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px">`;
      if (prevDupes.length) {
        html += `<div style="padding:7px 9px;background:#fdfaf3;border:1px solid #e8dcc0;border-radius:6px;font-size:11px"><span style="font-weight:700;color:var(--text-light)">전주 중복</span><br><span style="color:#b84a1a;font-weight:600">${prevDupes.join(', ')}</span></div>`;
      } else {
        html += `<div></div>`;
      }
      if (curDupes.length) {
        html += `<div style="padding:7px 9px;background:rgba(139,170,124,0.06);border:1px solid rgba(139,170,124,0.35);border-radius:6px;font-size:11px"><span style="font-weight:700;color:var(--text-light)">이번주 중복</span><br><span style="color:#b84a1a;font-weight:600">${curDupes.join(', ')}</span></div>`;
      } else {
        html += `<div></div>`;
      }
      html += `</div>`;
    }
    document.getElementById('historyContent').innerHTML = html;
    window._histCompare = { prevSchedule, thisSchedule: currentMenu };
    window._histCompareActive = true;
    document.getElementById('historyPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch(e) { showToast('비교 로드 실패'); }
}

async function selectWeekBtn(weekKey) {
  document.getElementById('weekStart').value = weekKey;
  localStorage.setItem('kkakung_last_week', weekKey);
  updateWeekDates();
  buildWeekButtons(); // active 갱신

  // 미저장 편집 중이면 localStorage 우선, 아니면 항상 DB 우선 (멀티 기기 동기화)
  const localSaved = JSON.parse(localStorage.getItem(CUR_KEY) || '{}');
  const localMatchesWeek = localSaved.weekStart === weekKey && localSaved.menu?.length;

  try {
    const res = await fetch(`${SB_URL}/rest/v1/kkakung_history?id=eq.${weekKey}&select=yusik`, { headers: SB_HEADERS });
    const rows = await res.json();
    const sched = rows[0]?.yusik?.schedule;
    // 실제 편집 중(isDirty)인 경우에만 localStorage 우선
    if (_isDirty && localMatchesWeek) {
      localSaved.menu.forEach(d => { d.date = new Date(d.date); });
      currentMenu = localSaved.menu;
    } else if (sched && sched.length) {
      currentMenu = sched.map(d => {
        const date = new Date(d.date);
        const base = { date, dayName: '', type: d.type };
        if (d.removed) return { ...base, removed: true, menus: [] };
        if (d.type === 'yusik') return { ...base, items: d.items || [], soup: d.soup || {name:'',ingredients:''} };
        return { ...base, menus: (d.menus || []).map(m => ({ ...m, displayName: m.name })) };
      });
      persistCurrent();
    } else if (localMatchesWeek) {
      localSaved.menu.forEach(d => { d.date = new Date(d.date); });
      currentMenu = localSaved.menu;
    } else {
      currentMenu = null;
    }
  } catch(e) {
    // 네트워크 오류 시 localStorage 폴백
    if (localMatchesWeek) {
      localSaved.menu.forEach(d => { d.date = new Date(d.date); });
      currentMenu = localSaved.menu;
    } else { currentMenu = null; }
  }
  window._histCompareActive = false;
  renderCurrentInHistory();
}
function formatDate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
function formatKorDate(date) {
  const days = ['일','월','화','수','목','금','토'];
  return `${date.getMonth()+1}월 ${date.getDate()}일(${days[date.getDay()]})`;
}

function updateWeekDates() {
  const start = new Date(document.getElementById('weekStart').value);
  const monday = getMonday(start);
  const friday = new Date(monday);
  friday.setDate(monday.getDate() + 4);
  document.getElementById('weekStart').value = formatDate(monday);
  document.getElementById('weekEnd').value = formatDate(friday);
}

function initDatePicker() {
  document.getElementById('weekStart').value = formatDate(getBaseMonday());
  updateWeekDates();
  buildWeekButtons();
}

async function generateMenu() {
  const startVal = document.getElementById('weekStart').value;
  if (!startVal) { showToast('⚠️ 날짜를 먼저 선택해주세요'); return; }

  // 이미 저장된 주차인지 확인 — 저장된 기록은 보존이 원칙
  const alreadySaved = await isWeekSaved(startVal);
  if (alreadySaved) {
    if (!confirm(`⚠️ 이미 저장된 주차예요!\n\n기록된 메뉴를 새로 뽑으면\n히스토리가 바뀝니다.\n\n계속 새로 뽑을까요?`)) return;
  } else if (currentMenu && currentMenu.length) {
    if (!confirm('현재 보이는 메뉴를 새 메뉴로 다시 뽑을까요?\n\n[확인] 새 메뉴 뽑기\n[취소] 그대로 유지')) return;
  }

  showToast('⏳ 히스토리 불러오는 중...');

  const monday = new Date(startVal);
  const weekKey = formatDate(monday);

  const [usedYusikNames, prevWeek] = await Promise.all([getUsedYusikNames(), getPrevWeekVeggies()]);

  const usedThisWeek = { hanwoo: [], chicken: [], p3: [] };

  const availableYusik = YUSIK_MAIN.filter(m => !usedYusikNames.has(m.name));
  const yusikPool = availableYusik.length >= 5 ? availableYusik : YUSIK_MAIN;

  const banchan5 = pickBanchanSet(yusikPool, 5);
  const shuffledSoup = shuffle(YUSIK_SOUP);

  const dayNames = ['월','화','수','목','금'];
  const days = [];
  // 양력 고정 공휴일 자동 처리
  const FIXED_HOLIDAYS = new Set(['01-01','03-01','05-01','05-05','06-06','08-15','10-03','10-09','12-25']);
  const isHoliday = d => FIXED_HOLIDAYS.has(`${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
  let yusikAssigned = false;

  for (let i = 0; i < 5; i++) {
    const date = new Date(monday);
    date.setDate(monday.getDate() + i);

    if (isHoliday(date)) {
      days.push({ type: 'yushik', date, dayName: dayNames[i], menus: [], removed: true });
    } else if (i === 2 && !yusikAssigned) {
      yusikAssigned = true;
      const items = banchan5;
      const soup = shuffledSoup[0];
      days.push({ type: 'yusik', date, dayName: dayNames[i], items, soup });
    } else {
      const menus = buildYushikMenu(i, usedThisWeek, prevWeek);
      days.push({ type: 'yushik', date, dayName: dayNames[i], menus });
    }
  }

  currentMenu = days;
  renderMenu();
  document.getElementById('bottomInfo').textContent =
    `${formatKorDate(monday)} ~ ${formatKorDate(new Date(monday.getTime() + 4*86400000))} 메뉴 (미저장)`;
}

const CUR_KEY = 'kkakung_current_menu';
const DRAFT_KEY = 'kkakung_modal_draft';

function persistCurrent() {
  if (!currentMenu) return;
  const weekStart = document.getElementById('weekStart').value;
  localStorage.setItem(CUR_KEY, JSON.stringify({ weekStart, menu: currentMenu, ts: Date.now() }));
}

// 원산지 입력 등 잦은 oninput 이벤트용 디바운스 저장
let _autoPersistTimer = null;
function _triggerAutoPersist() {
  clearTimeout(_autoPersistTimer);
  _autoPersistTimer = setTimeout(persistCurrent, 600);
}

function restoreCurrent() {
  try {
    const saved = JSON.parse(localStorage.getItem(CUR_KEY));
    if (!saved || !saved.menu || !saved.menu.length) return;
    // 저장된 주차가 현재 주차와 같을 때만 복원 (다른 주차 덮어쓰기 방지)
    const curWeek = document.getElementById('weekStart').value;
    if (saved.weekStart !== curWeek) return;
    saved.menu.forEach(day => { day.date = new Date(day.date); });
    currentMenu = saved.menu;
    updateWeekDates();
    buildWeekButtons();
    renderMenu();
  } catch(e) {}
}

function saveModalDraft() {
  if (!editTarget) return;
  try {
    localStorage.setItem(DRAFT_KEY, JSON.stringify({
      editTarget,
      name: (document.getElementById('editName') || {}).value || '',
      origin: (document.getElementById('editOrigin') || {}).value || '',
      midNote: (document.getElementById('editMidNote') || {}).value || '',
      chips: editChips,
      weekStart: document.getElementById('weekStart').value
    }));
  } catch(e) {}
}

function clearModalDraft() {
  try { localStorage.removeItem(DRAFT_KEY); } catch(e) {}
}

function restoreModalDraft() {
  try {
    const draft = JSON.parse(localStorage.getItem(DRAFT_KEY));
    if (!draft || !draft.editTarget || !currentMenu) return;
    if (draft.weekStart !== document.getElementById('weekStart').value) { clearModalDraft(); return; }
    const { di, mi, ii, type } = draft.editTarget;
    let valid = false;
    if (type === 'menu' && currentMenu[di]?.menus?.[mi]) valid = true;
    else if (type === 'yusik' && currentMenu[di]?.items?.[ii]) valid = true;
    else if (type === 'soup' && currentMenu[di]?.soup) valid = true;
    if (!valid) { clearModalDraft(); return; }
    editTarget = draft.editTarget;
    editChips = draft.chips || [];
    renderChipEditor();
    document.getElementById('chipPicker').className = 'chip-picker';
    document.getElementById('editName').value = draft.name || '';
    document.getElementById('editOrigin').value = draft.origin || '';
    document.getElementById('editMidNote').value = draft.midNote || '';
    if (type === 'menu') {
      document.getElementById('suggestionsSection').style.display = 'none';
      document.getElementById('midNoteSection').style.display = '';
    } else {
      document.getElementById('suggestionsSection').style.display = '';
      document.getElementById('midNoteSection').style.display = 'none';
      if (type === 'yusik') {
        setSuggestions(YUSIK_MAIN, 'other-chip', 'applyYusikSuggestion');
      } else {
        setSuggestions(YUSIK_SOUP, 'chicken-chip', 'applySoupSuggestion');
      }
    }
    document.getElementById('editModal').classList.add('active');
  // 이력을 받아오면 칩에 '3주 전' 배지가 붙는다 (없어도 편집엔 지장 없음)
  loadIngredHistory().then(() => { if (document.getElementById('editModal').classList.contains('active')) renderChipEditor(); });
    showToast('✏️ 편집 중이던 항목이 복원됐어요');
  } catch(e) { clearModalDraft(); }
}

// 임시 편집 취소 — CUR_KEY 지우고 DB 저장 데이터로 복원
async function resetToSaved() {
  const weekKey = document.getElementById('weekStart').value;
  if (!weekKey) { showToast('⚠️ 날짜를 먼저 선택해주세요'); return; }
  try {
    const res = await fetch(`${SB_URL}/rest/v1/kkakung_history?id=eq.${weekKey}&select=yusik`, { headers: SB_HEADERS });
    if (!res.ok) throw new Error();
    const rows = await res.json();
    const sched = rows[0]?.yusik?.schedule;
    if (!sched || !sched.length) {
      // DB 저장 없으면 로컬 초기화만
      localStorage.removeItem(CUR_KEY);
      currentMenu = null;
      renderMenu();
      showToast('↩️ 초기화됐어요 (저장된 데이터 없음)');
      return;
    }
    // DB schedule → currentMenu 변환
    currentMenu = sched.map(d => {
      const date = new Date(d.date);
      const base = { date, dayName: '', type: d.type };
      if (d.removed) return { ...base, removed: true, menus: [] };
      if (d.type === 'yusik') return { ...base, items: d.items || [], soup: d.soup || {name:'',ingredients:''} };
      return { ...base, menus: (d.menus || []).map(m => ({ ...m, displayName: m.name })) };
    });
    document.getElementById('weekStart').value = weekKey;
    updateWeekDates();
    // 비교 모드 종료 후 단독 편집 뷰로 복원
    window._histCompareActive = false;
    window._histCompare = null;
    persistCurrent(); // 복원된 메뉴를 CUR_KEY에 저장 → 새로고침 후에도 유지
    renderCurrentInHistory();
    showToast('↩️ DB 저장 상태로 원복됐어요');
  } catch(e) {
    localStorage.removeItem(CUR_KEY);
    currentMenu = null;
    renderMenu();
    showToast('↩️ 로컬 초기화됐어요');
  }
}

function renderMenu() {
  if (!currentMenu) return;
  persistCurrent();
  // 비교 모드 중이면 개별 카드 갱신만 (renderSelectedWeek가 관리)
  if (window._histCompareActive) return;
  // historyContent에 이번주 단독 편집 뷰 표시
  renderCurrentInHistory();

      <div style="padding:10px 14px 12px;background:#fdf8f5;border-top:1px solid #f5e0d0;">
        <label style="font-size:11px;font-weight:700;color:#a05030;display:block;margin-bottom:4px">📋 원산지 표기</label>
        <input
          type="text"
          value="${(day.origins||'').replace(/"/g,'&quot;')}"
          onchange="currentMenu[${di}].origins=this.value; persistCurrent()"
          oninput="currentMenu[${di}].origins=this.value; _triggerAutoPersist()"
          placeholder="예: 한우국내산, 알배추국내산, 파로이탈리아, 새송이국내산"
          style="width:100%;box-sizing:border-box;padding:7px 10px;font-size:12px;border:1px solid #f0d0b8;border-radius:8px;outline:none;font-family:inherit;color:#333;background:white;"
        />
      </div>
    </div>`;
}

// ===== 칩 에디터 =====
let editChips = [];
let selectedChipIdx = -1;
let chipTypingIdx = -1;
let _dragIdx = -1;
let _touchDragIdx = -1;

function initChipEditor(ingredStr) {
  editChips = (ingredStr || '').split(',').map(s => s.trim()).filter(Boolean);
  selectedChipIdx = -1;
  chipTypingIdx = -1;
  addingMode = false;
  renderChipEditor();
  document.getElementById('chipPicker').className = 'chip-picker';
}

function renderChipEditor() {
  const area = document.getElementById('chipEditorArea');
  const addingActive = addingMode ? ';background:var(--primary);color:white;opacity:1' : '';
  const addBtn = `<span class="ingred-chip" onclick="addChip()" style="opacity:0.6;font-size:12px;padding:4px 12px${addingActive}">추가</span>`;
  area.innerHTML = editChips.map((chip, i) => {
    if (i === chipTypingIdx) {
      const w = Math.max(44, chip.length * 13);
      return `<span class="ingred-chip selected" style="padding:3px 8px">` +
        `<input class="chip-text-input" id="cti" value="${chip.replace(/"/g,'&quot;')}" ` +
        `onblur="finalizeChipTyping(${i})" ` +
        `onkeydown="if(event.key==='Enter'||event.key==='Tab'){event.preventDefault();finalizeChipTyping(${i})}" ` +
        `style="width:${w}px"></span>`;
    }
    const sel = i === selectedChipIdx ? ' selected' : '';
    return `<span class="ingred-chip${sel}" data-chipidx="${i}" draggable="true"
      ondragstart="chipDragStart(${i})"
      ondragover="chipDragOver(event,${i})"
      ondragleave="chipDragLeave(event)"
      ondrop="chipDrop(event,${i})"
      ontouchstart="chipTouchStart(event,${i})"
      ontouchmove="chipTouchMove(event)"
      ontouchend="chipTouchEnd(event)"
      style="display:inline-flex;align-items:center;gap:4px;cursor:grab;touch-action:none">` +
      `<span onclick="onChipClick(${i})">${chip}</span>` + usageBadge(chip) +
      `<span onclick="removeChip(${i})" style="opacity:0.5;font-size:10px;cursor:pointer;line-height:1" title="삭제">✕</span>` +
      `</span>`;
  }).join('');
  area.innerHTML += addBtn;
  area.classList.toggle('has-selection', selectedChipIdx >= 0 || chipTypingIdx >= 0);
  syncChipsToTextarea();
  saveModalDraft();
  if (chipTypingIdx >= 0) setTimeout(() => { const el = document.getElementById('cti'); if (el){el.focus();el.select();} }, 0);
}

function onChipClick(idx) {
  if (chipTypingIdx === idx) return;
  if (selectedChipIdx === idx) {
    // 이미 선택된 칩 다시 클릭 → 직접입력
    chipTypingIdx = idx;
    renderChipEditor();
    document.getElementById('chipPicker').className = 'chip-picker';
  } else {
    chipTypingIdx = -1;
    selectedChipIdx = idx;
    renderChipEditor();
    showChipPicker(idx);
  }
}

function finalizeChipTyping(idx) {
  const el = document.getElementById('cti');
  if (el && el.value.trim()) editChips[idx] = el.value.trim();
  chipTypingIdx = -1;
  selectedChipIdx = -1;
  renderChipEditor();
  document.getElementById('chipPicker').className = 'chip-picker';
}

function replaceChip(idx, newVal) {
  editChips[idx] = newVal;
  // 주재료(idx=1) 변경 시 이름·서브재료도 자동 업데이트
  if (editTarget?.type === 'menu' && idx === 1) {
    const mtype = editTarget.menuType;
    const base = mtype === 'hanwoo' ? '한우' : mtype === 'chicken' ? '닭가슴살' : '';
    if (base) document.getElementById('editName').value = `${base} ${newVal}`;
    const pgroup = mtype === 'hanwoo' ? PAIRINGS.hanwoo : mtype === 'chicken' ? PAIRINGS.chicken : PAIRINGS.protein3;
    const subs = pgroup[newVal];
    if (subs && editChips.length > 2) {
      editChips[2] = subs[Math.floor(Math.random() * subs.length)];
    }
  }
  // 선택 상태 유지, 칩만 렌더 후 picker 내용 갱신 (화면 덜 튀게)
  selectedChipIdx = idx;
  chipTypingIdx = -1;
  renderChipEditor();
  showChipPicker(idx);
}

function showChipPicker(idx) {
  const picker = document.getElementById('chipPicker');
  const mtype = editTarget?.menuType;
  const etype = editTarget?.type;
  const current = editChips[idx];
  let options = [];

  if (etype === 'menu') {
    if (idx === 1) {
      options = mtype === 'hanwoo' ? HANWOO_MAIN_POOL : mtype === 'chicken' ? CHICKEN_MAIN_POOL : P3_POOL;
    } else {
      const pg = mtype === 'hanwoo' ? PAIRINGS.hanwoo : mtype === 'chicken' ? PAIRINGS.chicken : PAIRINGS.protein3;
      const all = new Set(['양파','당근','감자','쥬키니호박','브로콜리','두부','한우육수','닭육수','채소상탕']);
      Object.values(pg).forEach(subs => subs.forEach(s => all.add(s)));
      options = [...all];
    }
  } else if (etype === 'yusik') {
    const all = new Set();
    YUSIK_MAIN.forEach(m => m.ingredients.split(',').forEach(i => all.add(i.trim())));
    options = [...all];
  } else if (etype === 'soup') {
    const all = new Set();
    YUSIK_SOUP.forEach(s => s.ingredients.split(',').forEach(i => all.add(i.trim())));
    options = [...all];
  }

  options = options.filter(o => o && o !== current).sort((a, b) => a.localeCompare(b, 'ko'));
  if (!options.length) { picker.className = 'chip-picker'; return; }

  const cc = mtype === 'hanwoo' ? 'hanwoo-chip' : mtype === 'chicken' ? 'chicken-chip' : 'other-chip';
  picker.innerHTML = `<span class="chip-picker-label">"${current}" 대체 선택:</span>` +
    options.map(o => `<span class="suggestion-chip ${cc}" onclick="replaceChip(${idx},'${o.replace(/'/g,"\\'")}')">${o}</span>`).join('');
  picker.className = 'chip-picker active';
}

let addingMode = false;
let addPickerKnownIngreds = new Set(); // showAddPicker가 화면에 띄운 후보 전체(표준+자주쓰는재료) — 직접입력 중복 검사용

async function addChip() {
  if (addingMode) { // 다시 누르면 취소
    addingMode = false;
    renderChipEditor();
    document.getElementById('chipPicker').className = 'chip-picker';
    return;
  }
  addingMode = true;
  selectedChipIdx = -1;
  chipTypingIdx = -1;
  renderChipEditor();
  await loadCustomIngreds(); // 다른 기기(직원)가 등록한 재료까지 최신으로 받아옴
  showAddPicker();
}

function showAddPicker() {
  const picker = document.getElementById('chipPicker');
  const mtype = editTarget?.menuType;
  const etype = editTarget?.type;
  const used = new Set(editChips);

  let options = [];
  if (etype === 'yusik' || etype === 'soup') {
    const all = new Set();
    YUSIK_MAIN.forEach(m => m.ingredients.split(',').forEach(i => all.add(i.trim())));
    YUSIK_SOUP.forEach(s => s.ingredients.split(',').forEach(i => all.add(i.trim())));
    options = [...all].filter(o => o && !used.has(o));
  } else {
    const pg = mtype === 'hanwoo' ? PAIRINGS.hanwoo : mtype === 'chicken' ? PAIRINGS.chicken : PAIRINGS.protein3;
    const all = new Set(['양파','당근','감자','쥬키니호박','브로콜리','두부','한우육수','닭육수','채소상탕']);
    Object.values(pg).forEach(subs => subs.forEach(s => all.add(s)));
    options = [...all].filter(o => !used.has(o));
  }
  options = options.sort((a, b) => a.localeCompare(b, 'ko'));

  // "직접 입력"으로 추가했던 재료 중 이미 어딘가의 표준 목록에도 있는 건 자주 쓰는 재료 섹션에서
  // 뺌. 예전엔 "지금 편집 중인 종류(한우/닭/기타단백질)"의 표준 목록하고만 비교해서, 예를 들어
  // 한우 요리를 편집할 땐 렌틸콩·강황쌀처럼 기타단백질 표준 재료가 전부 "자주 쓰는 재료"로
  // 잘못 분류돼 화면을 가득 채우는 문제가 있었음 — 전 카테고리(ALL_INGREDIENTS) 기준으로 비교.
  const allIngredientSet = new Set(ALL_INGREDIENTS);
  const customIngreds = getCustomIngreds().filter(o => o && !used.has(o) && !allIngredientSet.has(o)).sort((a, b) => a.localeCompare(b, 'ko'));
  // addCustomIngred()에서 "이미 있는 재료인지" 검사할 때 쓰려고 지금 화면에 뜬 전체 후보 +
  // 다른 카테고리 표준 재료까지 전부 기억해둠 (직접입력이 다른 종류 표준재료와 겹쳐서
  // 또 저장되는 것 방지)
  addPickerKnownIngreds = new Set([...options, ...customIngreds, ...ALL_INGREDIENTS]);
  addPickerOptions = options;
  addPickerCustomIngreds = customIngreds;
  addPickerCc = mtype === 'hanwoo' ? 'hanwoo-chip' : mtype === 'chicken' ? 'chicken-chip' : 'other-chip';

  picker.innerHTML = `<span class="chip-picker-label">추가할 재료 선택:</span>`
    + `<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;">`
    + `<input id="customIngredInput" type="text" placeholder="검색 또는 직접 입력 (예: 원당)" style="flex:1;padding:5px 8px;border:1px solid var(--border);border-radius:8px;font-size:13px;outline:none;" oninput="renderAddPickerChips(this.value)" onkeydown="if(event.key==='Enter'){addCustomIngred();event.preventDefault();}">`
    + `<button onclick="addCustomIngred()" style="padding:5px 12px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;">추가</button>`
    + `</div>`
    + `<div id="addPickerChips" style="width:100%;display:flex;flex-wrap:wrap;row-gap:10px;column-gap:6px;"></div>`;
  picker.className = 'chip-picker active';
  renderAddPickerChips('');
  setTimeout(() => document.getElementById('customIngredInput')?.focus(), 50);
}

// 재료가 100개 넘게 쌓이다 보니 스크롤로 찾기 번거로워서, 직접입력 칸에 타이핑하는 즉시
// 아래 후보 목록도 같이 걸러지게 함 — 검색과 직접추가를 같은 입력창에서 처리.
let addPickerOptions = [];
let addPickerCustomIngreds = [];
let addPickerCc = 'other-chip';

function renderAddPickerChips(query) {
  const q = (query || '').trim();
  const custom = q ? addPickerCustomIngreds.filter(o => o.includes(q)) : addPickerCustomIngreds;
  const std = q ? addPickerOptions.filter(o => o.includes(q)) : addPickerOptions;

  // ⚠️ 예전엔 "자주 쓰는 재료" 칩들이 그냥 <div> 안에 있어서 바깥 flex-wrap/row-gap이 전혀
  // 안 먹혔음(일반 inline 줄바꿈이라 gap 자체가 무시됨) — 표준 재료 칩만 간격이 넓어지고
  // 자주 쓰는 재료는 그대로였던 원인. div 자체를 flex 컨테이너로 만들어서 동일 규칙을 받게 함.
  const customHtml = custom.length
    ? `<div style="width:100%;display:flex;flex-wrap:wrap;row-gap:10px;column-gap:6px;align-items:center;margin-bottom:6px;">`
      + `<span style="font-size:11px;color:#888;font-weight:700;width:100%;">자주 쓰는 재료</span>`
      + custom.map(o => `<span class="suggestion-chip" style="background:#fff3e0;color:#b06000;border-color:#f0b060;" onclick="addFromPicker('${o.replace(/'/g, "\\'")}')">${o}</span>`).join('')
      + `</div>` : '';
  const stdHtml = std.map(o => `<span class="suggestion-chip ${addPickerCc}" onclick="addFromPicker('${o.replace(/'/g, "\\'")}')">${o}</span>`).join('');

  document.getElementById('addPickerChips').innerHTML = customHtml + stdHtml
    || '<span style="font-size:12px;color:#999;">검색 결과 없음 — 그대로 [추가]를 누르면 새 재료로 저장돼요</span>';
}

function addFromPicker(val) {
  editChips.push(val);
  addingMode = false;
  selectedChipIdx = -1;
  renderChipEditor();
  document.getElementById('chipPicker').className = 'chip-picker';
}

function chipDragStart(idx) { _dragIdx = idx; }
function chipDragOver(e, idx) {
  e.preventDefault();
  if (_dragIdx !== -1 && _dragIdx !== idx) e.currentTarget.style.outline = '2px dashed var(--primary)';
}
function chipDragLeave(e) { e.currentTarget.style.outline = ''; }
function chipDrop(e, idx) {
  e.preventDefault();
  e.currentTarget.style.outline = '';
  if (_dragIdx === -1 || _dragIdx === idx) return;
  const c = editChips.splice(_dragIdx, 1)[0];
  editChips.splice(idx, 0, c);
  _dragIdx = -1; selectedChipIdx = -1;
  renderChipEditor();
}
function chipTouchStart(e, idx) {
  _touchDragIdx = idx;
  e.currentTarget.style.opacity = '0.6';
}
function chipTouchMove(e) { e.preventDefault(); }
function chipTouchEnd(e) {
  if (_touchDragIdx === -1) return;
  const t = e.changedTouches[0];
  const el = document.elementFromPoint(t.clientX, t.clientY)?.closest('[data-chipidx]');
  const toIdx = el ? parseInt(el.dataset.chipidx) : -1;
  document.querySelectorAll('[data-chipidx]').forEach(c => c.style.opacity = '');
  if (toIdx !== -1 && toIdx !== _touchDragIdx) {
    const c = editChips.splice(_touchDragIdx, 1)[0];
    editChips.splice(toIdx, 0, c);
    selectedChipIdx = -1;
    renderChipEditor();
  }
  _touchDragIdx = -1;
}

// ===== 자주 쓰는 재료(직접입력) =====
// 예전엔 localStorage(기기별 저장)라서 직원 폰에서 추가한 재료가 사장님 폰에는 하나도 안 보이는
// 문제가 있었음 — Supabase 공유 테이블로 옮김. 기기에 예전부터 쌓여있던 로컬 목록은 처음 열 때
// 자동으로 서버에 한 번 올려주고(마이그레이션), 그 뒤로는 서버 목록만 씀.
const OLD_CUSTOM_INGRED_KEY = 'kkakung_custom_ingreds';
const CUSTOM_INGRED_MIGRATED_KEY = 'kkakung_custom_ingreds_migrated_v1';
let customIngredsCache = [];

async function migrateLocalIngredsIfNeeded() {
  if (localStorage.getItem(CUSTOM_INGRED_MIGRATED_KEY)) return;
  let local = [];
  try { local = JSON.parse(localStorage.getItem(OLD_CUSTOM_INGRED_KEY) || '[]'); } catch (e) {}
  if (local.length) {
    const result = await serverWrite({ action: 'sync_ingredients', names: local });
    if (!result.ok) return; // 실패하면 플래그 안 세우고 다음에 다시 시도
  }
  localStorage.setItem(CUSTOM_INGRED_MIGRATED_KEY, '1');
}

async function loadCustomIngreds() {
  await migrateLocalIngredsIfNeeded();
  try {
    const res = await fetch(`${SB_URL}/rest/v1/kkakung_custom_ingredients?select=name`, { headers: SB_HEADERS });
    if (res.ok) customIngredsCache = (await res.json()).map(r => r.name);
  } catch (e) { console.warn('자주 쓰는 재료 로드 실패', e); }
}

// ===== 반찬 풀(YUSIK_MAIN/YUSIK_SOUP) 추가·삭제 =====
// YUSIK_MAIN/YUSIK_SOUP 자체는 코드에 박혀있는 배열이라 앱에서 직접 못 지웠음.
// Supabase에 "추가된 것"/"삭제된 것" 목록만 따로 저장해두고, 로드 시 이 두 배열을
// 그 위에 직접 합쳐넣음(const라도 배열 내용은 push/splice로 바꿀 수 있어서, 이 두 배열을
// 참조하는 다른 코드는 전혀 안 건드려도 됨).
async function applyDishOverrides() {
  try {
    const [addedRes, removedRes] = await Promise.all([
      fetch(`${SB_URL}/rest/v1/kkakung_dish_pool_added?select=type,name,ingredients`, { headers: SB_HEADERS }),
      fetch(`${SB_URL}/rest/v1/kkakung_dish_pool_removed?select=type,name`, { headers: SB_HEADERS }),
    ]);
    const added = addedRes.ok ? await addedRes.json() : [];
    const removed = removedRes.ok ? await removedRes.json() : [];
    const removedMain = new Set(removed.filter(r => r.type === 'main').map(r => r.name));
    const removedSoup = new Set(removed.filter(r => r.type === 'soup').map(r => r.name));
    for (let i = YUSIK_MAIN.length - 1; i >= 0; i--) if (removedMain.has(YUSIK_MAIN[i].name)) YUSIK_MAIN.splice(i, 1);
    for (let i = YUSIK_SOUP.length - 1; i >= 0; i--) if (removedSoup.has(YUSIK_SOUP[i].name)) YUSIK_SOUP.splice(i, 1);
    // 이름이 이미 있으면(하드코딩 원본이든 이전에 추가한 것이든) 재료만 덮어씀 — add_dish가
    // 신규추가뿐 아니라 "수정"으로도 쓰일 수 있게(같은 이름으로 다시 저장하면 그게 곧 수정).
    added.filter(a => a.type === 'main').forEach(a => {
      const existing = YUSIK_MAIN.find(m => m.name === a.name);
      if (existing) existing.ingredients = a.ingredients; else YUSIK_MAIN.push({ name: a.name, ingredients: a.ingredients });
    });
    added.filter(a => a.type === 'soup').forEach(a => {
      const existing = YUSIK_SOUP.find(m => m.name === a.name);
      if (existing) existing.ingredients = a.ingredients; else YUSIK_SOUP.push({ name: a.name, ingredients: a.ingredients });
    });
  } catch (e) { console.warn('반찬 목록 동기화 실패', e); }
}

    .slice().sort((a, b) => a.name.localeCompare(b.name, 'ko'));

        + `<button class="btn btn-primary" style="flex:1;padding:6px;font-size:12px;" onclick="saveEditDish('${d.name.replace(/'/g, "\\'")}')">저장</button>`
        + `<button class="btn btn-ghost" style="flex:1;padding:6px;font-size:12px;" onclick="cancelEditDish()">취소</button>`
        + `</div></div>`;
    }
    return `<div class="dish-manage-row">`

  const typeAtDelete = dishManageType;
  const pool = typeAtDelete === 'main' ? YUSIK_MAIN : YUSIK_SOUP;
  const idx = pool.findIndex(d => d.name === name);
  const removedDish = idx >= 0 ? { ...pool[idx] } : null;
  const result = await serverWrite({ action: 'delete_dish', type: typeAtDelete, name });
  if (!result.ok) { showToast('❌ 삭제 실패: ' + (result.error || '')); return; }
  if (idx >= 0) pool.splice(idx, 1);
  renderDishManageList(document.getElementById('dishManageSearch').value);
  showToast('🗑 삭제됐어요 — 모든 기기에 반영됩니다', removedDish ? {
    label: '실행취소',
    onClick: async () => {
      const r = await serverWrite({ action: 'add_dish', type: typeAtDelete, name: removedDish.name, ingredients: removedDish.ingredients });
      if (!r.ok) { showToast('❌ 복구 실패: ' + (r.error || '')); return; }
      const p = typeAtDelete === 'main' ? YUSIK_MAIN : YUSIK_SOUP;
      if (!p.some(d => d.name === removedDish.name)) p.push({ ...removedDish });
      if (dishManageType === typeAtDelete) renderDishManageList(document.getElementById('dishManageSearch').value);
      showToast('↩️ 복구됐어요');
    }
  } : null);
}

// ===== 저장 =====
// ===== 재료 준비 목록 =====
// 그 주에 뭘 사야 하는지 메뉴표를 보고 사람이 세고 있었다. 그걸 대신 세준다.
// 밑재료(양파·육수 등)도 사야 하는 건 마찬가지라 여기서는 빼지 않고 따로 묶어서 보여준다.
const SHOPPING_BASE = new Set(['양파','채소상탕','채소육수','한우육수','닭육수','소금']);

function buildShoppingList() {
  const main = {};   // 재료 -> { count, days:Set, menus:[] }
  const base = {};
  (currentMenu || []).forEach(day => {
    if (day.removed) return;
    const dayName = day.dayName || '';
    const collect = (ingredients, menuName) => {
      String(ingredients || '').split(',').forEach(raw => {
        const ing = raw.trim();
        if (!ing) return;
        const bucket = SHOPPING_BASE.has(ing) ? base : main;
        const e = (bucket[ing] = bucket[ing] || { count: 0, days: [], menus: [] });
        e.count++;
        if (dayName && !e.days.includes(dayName)) e.days.push(dayName);
        if (menuName && !e.menus.includes(menuName)) e.menus.push(menuName);
      });
    };
    if (day.type === 'yushik') {
      (day.menus || []).forEach(m => collect(m.ingredients, m.displayName || m.name));
    } else if (day.type === 'yusik') {
      (day.items || []).forEach(it => collect(it.ingredients, it.name));
      if (day.soup) collect(day.soup.ingredients, day.soup.name);
    }
  });
  const toList = obj => Object.keys(obj)
    .map(k => ({ name: k, ...obj[k] }))
    .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
  return { main: toList(main), base: toList(base) };
}

function openShoppingList() {
  if (!currentMenu) { showToast('⚠️ 먼저 메뉴를 생성해주세요'); return; }
  const { main, base } = buildShoppingList();
  const rowsHtml = list => list.map(x =>
    `<div class="shop-row"><b>${escapeDup(x.name)}</b>` +
    `<span class="shop-days">${x.days.join('·')}</span>` +
    `<span class="shop-cnt">${x.count}개 메뉴</span></div>`).join('');
  document.getElementById('shoppingContent').innerHTML =
    (main.length ? `<div class="shop-head">주재료 ${main.length}가지</div>` + rowsHtml(main)
                 : '<p style="color:var(--text-light);font-size:13px">재료가 없어요</p>')
    + (base.length ? `<div class="shop-head" style="margin-top:14px">밑재료 ${base.length}가지</div>` + rowsHtml(base) : '');
  document.getElementById('shoppingModal').classList.add('active');
}

function copyShoppingList() {
  const { main, base } = buildShoppingList();
  const week = document.getElementById('weekStart').value || '';
