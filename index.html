  const text = `[까꿍디미방 재료 준비 ${week}]\n\n■ 주재료\n`
    + main.map(line).join('\n')
    + (base.length ? `\n\n■ 밑재료\n` + base.map(line).join('\n') : '');
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => showToast('📋 목록을 복사했어요')).catch(() => showToast('복사에 실패했어요'));
  } else { showToast('이 환경에서는 복사가 안 돼요'); }
}

// ===== 재료 사용 이력 =====
// "브로콜리 마지막으로 쓴 게 언제였지?"를 메뉴 짜는 중에 알 수 있게 한다.
// 전주 비교는 바로 앞 주만 보여줘서, 3~4주 전에 쓴 재료가 겹치는 건 못 잡았다.
// kkakung_history에 이미 몇 달치가 쌓여 있으므로 그걸 그대로 쓴다.
let _ingredHistory = null;   // { '브로콜리': { last:'2026-08-11', weeks:['2026-08-11', ...] } }
let _ingredHistoryAt = 0;

// 밑재료는 매주 들어가므로 이력을 봐도 의미가 없다
const USAGE_SKIP = new Set(['양파','채소상탕','채소육수','한우육수','닭육수','소금','한우','닭','닭가슴살','']);

async function loadIngredHistory(force) {
  // 편집 중 매번 부르지 않게 10분간 재사용
  if (!force && _ingredHistory && Date.now() - _ingredHistoryAt < 600000) return _ingredHistory;
  try {
    const res = await fetch(`${SB_URL}/rest/v1/kkakung_history?id=like.20*&select=id,yusik&order=id.desc&limit=40`, { headers: SB_HEADERS });
    if (!res.ok) throw new Error('load fail');
    const rows = await res.json();
    const map = {};
    rows.forEach(row => {
      const weekId = row.id;
      ((row.yusik && row.yusik.schedule) || []).forEach(day => {
        if (day.type !== 'yushik' || day.removed) return;
        (day.menus || []).forEach(m => {
          String(m.ingredients || '').split(',').forEach(raw => {
            const ing = raw.trim();
            if (!ing || USAGE_SKIP.has(ing)) return;
            const e = (map[ing] = map[ing] || { last: '', weeks: [] });
            if (!e.weeks.includes(weekId)) e.weeks.push(weekId);
            if (weekId > e.last) e.last = weekId;
          });
        });
      });
    });
    _ingredHistory = map;
    _ingredHistoryAt = Date.now();
  } catch (e) {
    _ingredHistory = _ingredHistory || {}; // 실패해도 편집은 계속 되게
  }
  return _ingredHistory;
}

// 이번 주 기준으로 "몇 주 전"인지. 못 찾으면 null
function weeksAgoOf(ingredient) {
  if (!_ingredHistory) return null;
  const e = _ingredHistory[String(ingredient || '').trim()];
  if (!e || !e.last) return null;
  const cur = document.getElementById('weekStart') ? document.getElementById('weekStart').value : '';
  if (!/^\d{4}-\d{2}-\d{2}$/.test(cur) || !/^\d{4}-\d{2}-\d{2}$/.test(e.last)) return null;
  const diff = Math.round((new Date(cur + 'T00:00:00Z') - new Date(e.last + 'T00:00:00Z')) / (7 * 86400000));
  return { weeks: diff, last: e.last, count: e.weeks.length };
}

// 칩 옆에 붙는 라벨. 최근일수록 눈에 띄게.
function usageBadge(ingredient) {
  const u = weeksAgoOf(ingredient);
  if (!u) return '';
  if (u.weeks <= 0) return '';                       // 이번 주 안에서의 중복은 중복검사가 따로 잡는다
  const label = u.weeks === 1 ? '지난주' : u.weeks + '주 전';
  const cls = u.weeks <= 2 ? 'recent' : 'old';
  return `<span class="usage-badge ${cls}" title="마지막 사용 ${u.last} · 최근 ${u.count}주 사용">${label}</span>`;
}

// ===== 중기에서 빼야 하는 재료 =====
// 새우는 중기 이유식에 넣지 않는다. 예전엔 "중기 주의" 칸에 사람이 직접 "새우 제외"를 적어야 했고,
// 적는 걸 잊으면 그대로 나갔다(실제로 인쇄물에 새우가 그냥 들어간 적 있음).
// 이제 재료에 들어 있으면 자동으로 표시되게 고정한다. 나중에 뺄 재료가 생기면 여기만 고치면 됨.
const MID_STAGE_BANNED = ['새우'];

// 이 메뉴에 중기 금지 재료가 들어 있으면 그 목록을 돌려준다
function bannedForMidStage(ingredients) {
  const list = String(ingredients || '').split(',').map(x => x.trim());
  return MID_STAGE_BANNED.filter(b => list.some(x => x === b || x.includes(b)));
}

// 화면·저장·인쇄에 쓸 "중기 주의" 문구. 사람이 직접 적은 메모가 있으면 같이 보여준다.
function midNoteOf(menu) {
  if (!menu) return '';
  const banned = bannedForMidStage(menu.ingredients);
  const auto = banned.length ? banned.join('·') + ' 제외' : '';
  const manual = String(menu.midNote || '').trim();
  if (!auto) return manual;
  // 사람이 이미 같은 내용을 적어뒀으면 중복해서 붙이지 않는다
  if (manual && banned.every(b => manual.includes(b))) return manual;
  return manual ? auto + ' / ' + manual : auto;
}

// ===== 성분(재료 중량) 표기 =====
// 사장님이 준 기준:
//   소고기 익힌 것 — 작은팩 18g / 큰팩 24g
//   닭    익힌 것 — 작은팩 20g / 큰팩 30g
//   잎채소 5g · 그 밖의 야채 20g · 양파 20g  (전부 작은팩 230g 기준)
//
// ⚠️ 용량은 230·240(작은팩)과 300·310(큰팩) 네 가지가 있다.
//    단백질은 작은/큰 두 값을 직접 받았으므로 그대로 쓴다.
//    채소는 작은팩 값만 받아서, 큰팩은 팩 크기 비율(300/230)로 올려 잡았다. ← 확인 필요
const SMALL_VOLUMES = [230, 240];
const BIG_VOLUMES = [300, 310];
// 큰팩 환산 — 팩 크기 비율(1.3)이 아니라 1.5배. 작은팩 20g이면 큰팩 30g.
// (단백질은 사장님이 준 값을 그대로 쓰므로 이 비율을 타지 않는다: 한우 18→24, 닭 20→30)
const BIG_SCALE = 1.5;

// ── 재료 분류 ────────────────────────────────────────────────
// 국물류 — 중량 표기 대상 아님
const BROTH = ['채소상탕','한우육수','닭육수','채소육수','물','소금'];
// 단백질 — 작은팩/큰팩 값을 직접 받음 (익힌 기준)
const PROTEIN_G = {
  '한우':     { small: 18, big: 24 },
  '닭가슴살': { small: 20, big: 30 },
  '닭':       { small: 20, big: 30 },
  // 생선·해산물은 닭과 같은 값
  '대구살':   { small: 20, big: 30 },
  '연어':     { small: 20, big: 30 },
  '가자미':   { small: 20, big: 30 },
  '새우':     { small: 20, big: 30 },
};
// 잎채소 — 7g 고정. 아래 배분 계산에 끼지 않는다.
const LEAF_VEGGIES = ['근대','적근대','청경채','로메인','케일','아욱','비타민채소','비타민','배추','호박잎','시금치'];
const LEAF_G = 7;
// 양파 — 매 메뉴에 들어가는 고정 재료
const ONION = ['양파'];
const ONION_G = 20;
// 해조류 — 사장님이 맡기셔서 3g으로 잡음(잎채소보다 적게 쓰므로)
const SEAWEED = ['미역','파래김','매생이'];
const SEAWEED_G = 3;

// ── 배분 대상 ────────────────────────────────────────────────
// ⚠️ 재료 중량은 고정값이 아니라 "같이 들어간 재료"에 따라 달라진다.
//    감자+느타리 → 20/10,  감자+애호박 → 15/15,  느타리+사과 → 15/15
//    무거운 것(뿌리·열매채소)이 가벼운 것(버섯·과일·곡물)보다 2배를 가져간다.
const VEGGIE_POOL = 30;   // 2가지 이상일 때 나눠 갖는 총량
const VEGGIE_SOLO = 20;   // 1가지만 들어갔을 때
const HEAVY_ITEMS = ['감자','고구마','단호박','밤단호박','땅콩호박','애호박','쥬키니호박','둥근호박',
                     '당근','무','비트','브로콜리','콜리플라워','노각','양배추','적채'];
const LIGHT_ITEMS = ['팽이버섯','팽이','느타리버섯','느타리','새송이버섯','새송이','양송이','송고버섯','만가닥버섯',
                     '사과','배','아보카도',
                     '연두부','두부','렌틸콩','병아리콩',
                     '퀴노아','파로','차조','오트밀','햄프시드'];

// ── 장 단위로 세는 재료 ──────────────────────────────────────
// 치즈는 무게가 아니라 "몇 팩당 한 장". 단계마다 다르고 팩 크기와는 무관.
const SLICE_ITEMS = {
  '아기치즈': { 중기: 4, 후기: 3, 완료기: 2 },
};
// 개수로 세는 재료 — 단계·팩 크기와 상관없이 한 팩에 정해진 개수
const COUNT_ITEMS = {
  '계란노른자': { per: 1, unit: '개' },
  '달걀노른자': { per: 1, unit: '개' },
};
function countInfoOf(name) { return COUNT_ITEMS[String(name || '').trim()] || null; }
function sliceInfoOf(name) { return SLICE_ITEMS[String(name || '').trim()] || null; }

// 0.375 → ⅜ 처럼 보기 좋게. 딱 떨어지지 않으면 소수로.
const FRACTION_TEXT = {
  0.25: '¼', 0.333: '⅓', 0.375: '⅜', 0.5: '½', 0.625: '⅝', 0.667: '⅔', 0.75: '¾',
  1: '1', 1.5: '1½', 2: '2', 2.5: '2½', 3: '3',
};
function amountText(n) {
  const key = Math.round(n * 1000) / 1000;
  if (FRACTION_TEXT[key] !== undefined) return FRACTION_TEXT[key];
  const whole = Math.floor(key), rest = Math.round((key - whole) * 1000) / 1000;
  if (whole > 0 && FRACTION_TEXT[rest] !== undefined) return whole + FRACTION_TEXT[rest];
  return String(Math.round(key * 100) / 100);
}
// 치즈는 단계마다 다르고, 큰팩이면 1.5배
function sliceText(info, volume) {
  const mul = isBig(volume) ? BIG_SCALE : 1;
  return Object.keys(info).map(st => `${st} ${amountText(mul / info[st])}장`).join(' · ');
}

function isBroth(name) { return BROTH.includes(String(name || '').trim()); }
function isBig(volume) { return BIG_VOLUMES.includes(Number(volume)); }
function scale(g, volume) { return isBig(volume) ? Math.round(g * BIG_SCALE) : g; }

// 메뉴 하나의 성분표
function nutritionOf(menu, volume) {
  const names = String(menu && menu.ingredients || '').split(',').map(x => x.trim()).filter(Boolean);
  const rows = [], unknown = [], broth = [], slices = [];
  const pool = [];   // 배분 대상

  names.forEach(name => {
    if (isBroth(name)) { broth.push(name); return; }
    const sl = sliceInfoOf(name);
    if (sl) { slices.push({ name, text: sliceText(sl, volume) }); return; }
    const ci = countInfoOf(name);
    if (ci) { slices.push({ name, text: '한 팩에 ' + amountText(ci.per * (isBig(volume) ? BIG_SCALE : 1)) + ci.unit }); return; }
    if (PROTEIN_G[name]) {
      rows.push({ name, grams: isBig(volume) ? PROTEIN_G[name].big : PROTEIN_G[name].small });
      return;
    }
    if (ONION.includes(name))        { rows.push({ name, grams: scale(ONION_G, volume) }); return; }
    if (LEAF_VEGGIES.includes(name)) { rows.push({ name, grams: scale(LEAF_G, volume) }); return; }
    if (SEAWEED.includes(name))      { rows.push({ name, grams: scale(SEAWEED_G, volume) }); return; }
    if (HEAVY_ITEMS.includes(name))  { pool.push({ name, w: 2 }); return; }
    if (LIGHT_ITEMS.includes(name))  { pool.push({ name, w: 1 }); return; }
    unknown.push(name);
  });

  // 배분: 1가지면 20g, 2가지 이상이면 30g을 가중치로 나눔
  if (pool.length === 1) {
    rows.push({ name: pool[0].name, grams: scale(VEGGIE_SOLO, volume) });
  } else if (pool.length > 1) {
    const sum = pool.reduce((a, x) => a + x.w, 0);
    pool.forEach(x => rows.push({ name: x.name, grams: scale(Math.round(VEGGIE_POOL * x.w / sum), volume) }));
  }

  // 원래 적으신 순서대로 보여준다
  rows.sort((a, b) => names.indexOf(a.name) - names.indexOf(b.name));
  return { rows, unknown, broth, slices, total: rows.reduce((a, r) => a + r.grams, 0) };
}

function unknownIngredients() {
  const set = new Set();
  (currentMenu || []).forEach(day => {
    if (day.type !== 'yushik' || day.removed) return;
    (day.menus || []).forEach(m => nutritionOf(m, 230).unknown.forEach(x => set.add(x)));
  });
  return [...set];
}

function openNutrition() {
  if (!currentMenu) { showToast('⚠️ 먼저 메뉴를 생성해주세요'); return; }
  const vols = [
    { label: '작은팩 (230·240g)', v: 230 },
    { label: '큰팩 (300·310g)', v: 300 },
  ];
  let html = '';
  (currentMenu || []).forEach(day => {
    if (day.type !== 'yushik' || day.removed) return;
    (day.menus || []).forEach(m => {
      const name = m.displayName || m.name || '';
      html += `<div class="nut-menu"><div class="nut-head">${escapeDup(day.dayName)}요일 · ${escapeDup(typeLabel(m.type))} — ${escapeDup(name)}</div>`;
      vols.forEach(vv => {
        const n = nutritionOf(m, vv.v);
        html += `<div class="nut-vol">${vv.label}</div><div class="nut-rows">`
          + n.rows.map(r => `<span class="nut-chip"><b>${escapeDup(r.name)}</b> ${r.grams}g</span>`).join('')
          + (n.rows.length ? `<span class="nut-total">합 ${n.total}g</span>` : '')
          + '</div>'
          // 치즈·계란은 무게가 아니라 장·개수로 세는데 용량에 따라 달라지므로 같은 블록에 둔다
          + n.slices.map(x => `<div class="nut-slice"><b>${escapeDup(x.name)}</b> — ${escapeDup(x.text)}</div>`).join('');
      });
      const u = nutritionOf(m, 230).unknown;
      if (u.length) html += `<div class="nut-unknown">중량 미등록: ${escapeDup(u.join(', '))}</div>`;
      html += '</div>';
    });
  });
  const allUnknown = unknownIngredients();
  document.getElementById('nutritionContent').innerHTML =
    (html || '<p style="color:var(--text-light);font-size:13px">이유식 메뉴가 없어요</p>')
    + (allUnknown.length
        ? `<div class="nut-warn">아직 중량이 정해지지 않은 재료 ${allUnknown.length}가지<br><b>${escapeDup(allUnknown.join(', '))}</b><br><span>이 재료들은 합계에서 빠져 있어요.</span></div>`
        : '');
  document.getElementById('nutritionModal').classList.add('active');
}

function copyNutrition() {
  if (!currentMenu) return;
  const week = document.getElementById('weekStart').value || '';
  let out = `[까꿍디미방 성분표 ${week}]\n`;
  (currentMenu || []).forEach(day => {
    if (day.type !== 'yushik' || day.removed) return;
    (day.menus || []).forEach(m => {
      out += `\n${day.dayName}요일 · ${typeLabel(m.type)} — ${m.displayName || m.name}\n`;
      [[230, '작은팩'], [300, '큰팩']].forEach(([v, lb]) => {
        const n = nutritionOf(m, v);
        if (!n.rows.length && !n.slices.length) return;
        out += `  ${lb}: ` + n.rows.map(r => `${r.name} ${r.grams}g`).join(', ')
             + n.slices.map(x => `${n.rows.length ? ', ' : ''}${x.name} ${x.text}`).join('') + `\n`;
      });
      const u = nutritionOf(m, 230).unknown;
      if (u.length) out += `  (중량 미등록: ${u.join(', ')})\n`;
    });
  });
  if (navigator.clipboard) {
    navigator.clipboard.writeText(out).then(() => showToast('📋 성분표를 복사했어요')).catch(() => showToast('복사 실패'));
  } else { showToast('이 환경에서는 복사가 안 돼요'); }
}

// 단계별 밥 양(익힌 밥, 작은팩 230g 기준). 큰팩은 1.5배.
const RICE_BY_STAGE = { 중기: 57, 후기: 58, 완료기: 75 };
const STAGES_ORDER = ['중기', '후기', '완료기'];

// 1일 영양소 섭취기준 (보건복지부·한국영양학회 2020 한국인 영양소 섭취기준)
//  중기·후기 → 영아 6-11개월 / 완료기 → 유아 1-2세
//  값 종류: RNI 권장섭취량, AI 충분섭취량. 순서는 NUTRIENT_LABELS와 같다.
const DRI_BY_STAGE = {
  중기:   [600,  90, 15, 25, 300, 6, 370],
  후기:   [600,  90, 15, 25, 300, 6, 370],
  완료기: [900, 130, 20, 25, 500, 6, 810],
};
const DRI_AGE_LABEL = { 중기: '영아 6-11개월', 후기: '영아 6-11개월', 완료기: '유아 1-2세' };

const NUTRIENT_LABELS = ['열량', '탄수화물', '단백질', '지방', '칼슘', '철', '나트륨'];
const NUTRIENT_UNITS  = ['kcal', 'g', 'g', 'g', 'mg', 'mg', 'mg'];

// 재료 목록(이름·중량)에 밥을 더해 영양성분 합계를 낸다
function sumNutrients(items) {
  const sum = [0, 0, 0, 0, 0, 0, 0];
  const missing = [];
  items.forEach(it => {
    const per = NUTRIENT_PER_100G[it.name];
    if (!per) { missing.push(it.name); return; }
    for (let i = 0; i < 7; i++) sum[i] += per[i] * it.grams / 100;
  });
  return { sum, missing };
}

// 메뉴 하나를 단계·용량 기준으로 계산
function nutritionFacts(menu, stage, volume) {
  const n = nutritionOf(menu, volume);
  const items = n.rows.slice();

  // 밥 (단계별, 큰팩은 1.5배)
  const rice = RICE_BY_STAGE[stage] * (isBig(volume) ? BIG_SCALE : 1);
  items.push({ name: '밥', grams: Math.round(rice) });

  // 치즈·계란처럼 장·개수로 세는 것도 무게로 환산해서 더한다
  const CHEESE_G = 18, YOLK_G = 17;   // 아기치즈 1장 ≈ 18g, 노른자 1개 ≈ 17g
  String(menu && menu.ingredients || '').split(',').forEach(raw => {
    const name = raw.trim();
    const sl = sliceInfoOf(name);
    if (sl && sl[stage]) {
      const cnt = (isBig(volume) ? BIG_SCALE : 1) / sl[stage];
      items.push({ name, grams: Math.round(cnt * CHEESE_G * 10) / 10 });
      return;
    }
    const ci = countInfoOf(name);
    if (ci) items.push({ name, grams: Math.round(ci.per * (isBig(volume) ? BIG_SCALE : 1) * YOLK_G * 10) / 10 });
  });

  const { sum, missing } = sumNutrients(items);
  const values = sum.map((v, i) => i === 0 ? Math.round(v) : Math.round(v * 10) / 10);
  const dri = DRI_BY_STAGE[stage];
  // 한 팩은 하루치가 아니라 한 끼라서, 보통 20~35% 정도가 나온다
  const pct = dri ? sum.map((v, i) => Math.round(v / dri[i] * 100)) : null;
  return { items, values, pct, missing };
}

// 숫자만 보면 "단백질 85%? 너무 많은 거 아냐" "칼슘 3%면 부족한 거 아냐" 하고
// 놀라시는 손님이 있어서, 계산값을 보고 쉬운 말로 풀어 준다.
// 고정 문구가 아니라 실제 수치에 따라 달라진다.
function customerNote(menu) {
  const combos = [];
  STAGES_ORDER.forEach(st => [230, 300].forEach(v => {
    const f = nutritionFacts(menu, st, v);
    if (f.pct) combos.push({ stage: st, pct: f.pct, val: f.values });
  }));
  if (!combos.length) return [];

  const at = i => combos.map(c => c.pct[i]);
  const lo = i => Math.min(...at(i)), hi = i => Math.max(...at(i));
  const notes = [];

  // 열량 — 한 끼로 적당한지
  const kLo = lo(0), kHi = hi(0);
  if (kHi <= 45) {
    notes.push({ t: '한 끼 분량으로 알맞아요',
      d: `하루 필요한 열량의 ${kLo}~${kHi}% 정도예요. 이유식 한 팩은 하루치가 아니라 한 끼라서 이 정도가 보통이에요.` });
  } else {
    notes.push({ t: '한 끼치고는 든든한 편이에요',
      d: `하루 필요한 열량의 ${kLo}~${kHi}%예요. 잘 드시는 아기에게 알맞아요.` });
  }

  // 단백질 — 높게 나와도 놀라지 않으시게
  const pHi = hi(2);
  if (pHi >= 50) {
    notes.push({ t: '단백질이 넉넉해요',
      d: `한 팩에 하루 권장량의 ${lo(2)}~${pHi}%가 들어 있어요. 아기 단백질 권장량이 원래 작아서(하루 15~20g) 단백질 재료가 조금만 들어가도 비율이 높게 나와요. 성장기에 필요한 영양이라 걱정하지 않으셔도 돼요.` });
  } else if (pHi >= 25) {
    notes.push({ t: '단백질이 알맞게 들어 있어요', d: `한 팩에 하루 권장량의 ${lo(2)}~${pHi}%예요.` });
  }

  // 칼슘 — 낮게 나오는 이유를 먼저 설명
  const cHi = hi(4);
  const hasCal = /아기치즈|두부|연두부|미역|파래김|매생이|케일|아욱|청경채/.test(String(menu && menu.ingredients || ''));
  if (cHi < 12) {
    notes.push({ t: '칼슘이 낮아 보여도 괜찮아요',
      d: `하루 필요량의 ${lo(4)}~${cHi}%로 나오는데, 이 시기 칼슘은 대부분 분유나 모유에서 채워요. 죽으로 칼슘을 다 채우는 게 아니라서 정상이에요.`
        + (hasCal ? '' : ' 젖을 줄이는 완료기에는 치즈나 두부가 들어간 메뉴를 곁들이면 좋아요.') });
  } else if (hasCal) {
    notes.push({ t: '칼슘을 챙긴 메뉴예요', d: `하루 필요량의 ${lo(4)}~${cHi}%가 들어 있어요.` });
  }

  // 철 — 이 시기 가장 부족하기 쉬운 영양소
  const fHi = hi(5);
  if (fHi >= 12) notes.push({ t: '철분이 들어 있어요',
    d: `하루 권장량의 ${lo(5)}~${fHi}%예요. 생후 6개월부터는 철분이 부족해지기 쉬워서 이유식으로 챙기는 게 좋아요.` });

  return notes;
}

// ===== 저장 전 재료 개수 검사 =====
// 실제 저장된 51개 메뉴를 세어보니 2개(67%)·4개(26%)가 대부분이고 5개는 한 번뿐이었다.
// 재료가 많아지면 단계별로 빼야 할 게 늘어서(중기는 새우 빼고, 후기는 연두부 빼고…)
// 조리도 헷갈리고 손님 설명도 어려워진다. 넘으면 저장 전에 한 번 물어본다.
const MAX_INGREDIENTS = 4;  // 밑재료·단백질 빼고 센 개수

// 밑재료는 매번 들어가므로 개수에서 뺀다
const COUNT_SKIP = new Set(['양파', '채소상탕', '채소육수', '한우육수', '닭육수', '소금', '']);
// 단백질이 한 메뉴에 둘 이상 들어가면 단계마다 다른 걸 먹게 된다
const PROTEIN_WORDS = ['새우', '연두부', '두부', '대구살', '연어', '가자미', '계란노른자', '달걀노른자',
                       '아기치즈', '병아리콩', '렌틸콩', '한우', '닭가슴살', '닭'];

function mainIngredientsOf(menu) {
  return String(menu && menu.ingredients || '').split(',')
    .map(x => x.trim())
    .filter(x => x && !COUNT_SKIP.has(x));
}

// 재료가 너무 많거나 단백질이 겹치는 메뉴를 찾는다
function findHeavyMenus() {
  const out = [];
  (currentMenu || []).forEach(day => {
    if (day.type !== 'yushik' || day.removed) return;
    (day.menus || []).forEach(m => {
      const list = mainIngredientsOf(m);
      // 단백질(한우/닭가슴살 등 주재료 포함) 개수
      const proteins = list.filter(x => PROTEIN_WORDS.some(w => x.includes(w)));
      const tooMany = list.length > MAX_INGREDIENTS;
      const multiProtein = proteins.length > 1;
      if (!tooMany && !multiProtein) return;
      out.push({
        day: day.dayName || '',
        typeName: typeLabel(m.type),
        name: m.displayName || m.name || '',
        list, count: list.length, proteins, tooMany, multiProtein,
      });
    });
  });
  return out;
}

// 팝업. '그대로 저장하기'면 true.
function confirmHeavyMenus(heavy) {
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'dup-overlay';
    wrap.innerHTML =
      '<div class="dup-box">'
      + '<h3>재료가 평소보다 많아요</h3>'
      + '<p class="dup-sub">재료가 많으면 단계마다 빼야 할 게 늘어서 조리도 손님 설명도 헷갈려요. '
      + '보통은 재료 ' + MAX_INGREDIENTS + '개까지 넣으셨어요.</p>'
      + '<div class="dup-list">'
      + heavy.map(x =>
          '<div class="heavy-item">'
          + '<div class="heavy-top"><span class="dup-type t-' + 'x' + '">' + escapeDup(x.day) + '요일 · ' + escapeDup(x.typeName) + '</span>'
          + (x.tooMany ? '<span class="heavy-flag">재료 ' + x.count + '개</span>' : '')
          + (x.multiProtein ? '<span class="heavy-flag warn">단백질 ' + x.proteins.length + '개</span>' : '')
          + '</div>'
          + '<div class="heavy-ing">' + escapeDup(x.list.join(', ')) + '</div>'
          + (x.multiProtein
              ? '<div class="heavy-note">' + escapeDup(x.proteins.join(' · ')) + ' — 단계마다 빠지는 게 달라져요</div>' : '')
          + '</div>'
        ).join('')
      + '</div>'
      + '<div class="dup-btns">'
      + '<button type="button" class="dup-fix">수정하기</button>'
      + '<button type="button" class="dup-go">그대로 저장하기</button>'
      + '</div></div>';
    const done = v => { wrap.remove(); resolve(v); };
    wrap.querySelector('.dup-fix').onclick = () => done(false);
    wrap.querySelector('.dup-go').onclick = () => done(true);
    wrap.onclick = e => { if (e.target === wrap) done(false); };
    document.body.appendChild(wrap);
    wrap.querySelector('.dup-fix').focus();
  });
}

// ===== 저장 전 재료 중복 검사 =====
// 같은 단백질(한우/닭/기타) 안에서 같은 재료가 여러 날 나오면, 그 메뉴를 계속 시키는 아기는
// 같은 걸 반복해서 먹게 된다. 메뉴를 짜다 보면 놓치기 쉬워서 저장 직전에 한 번 잡아준다.
// ⚠️ 기존 '중복 확인' 버튼(checkConflicts)은 건드리지 않는다 — 그건 전체 재료를 보는 다른 기능이고
//    면제 목록도 다르게 맞춰져 있다.
// 매번 들어가는 밑재료는 중복이 당연하므로 뺀다.
const DUP_BASE_INGREDIENTS = new Set([
  '양파', '채소상탕', '채소육수', '한우육수', '닭육수', '소금',
  '한우', '닭', '닭가슴살', '',
]);

// [{ type:'hanwoo', typeName:'한우', ingredient:'당근', days:['목','금'] }, ...]
function findTypeDuplicates() {
  const byType = {}; // type -> ingredient -> [요일]
  (currentMenu || []).forEach(day => {
    if (day.type !== 'yushik' || day.removed) return;
    (day.menus || []).forEach(m => {
      if (!m || !m.type) return;
      String(m.ingredients || '').split(',').forEach(raw => {
        const ing = raw.trim();
        if (!ing || DUP_BASE_INGREDIENTS.has(ing)) return;
        byType[m.type] = byType[m.type] || {};
        const days = (byType[m.type][ing] = byType[m.type][ing] || []);
        if (!days.includes(day.dayName)) days.push(day.dayName); // 같은 날 두 번 적은 건 중복 아님
      });
    });
  });
  const out = [];
  Object.keys(byType).forEach(type => {
    Object.keys(byType[type]).forEach(ing => {
      const days = byType[type][ing];
      if (days.length > 1) out.push({ type, typeName: typeLabel(type), ingredient: ing, days });
    });
  });
  // 많이 겹치는 것부터
  out.sort((a, b) => b.days.length - a.days.length || a.typeName.localeCompare(b.typeName));
  return out;
}

// 팝업. '그대로 저장하기'면 true, '수정하기'면 false를 돌려준다.
function confirmDuplicates(dups) {
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'dup-overlay';
    wrap.innerHTML =
      '<div class="dup-box">'
      + '<h3>같은 재료가 여러 날 들어갔어요</h3>'
      + '<p class="dup-sub">같은 메뉴를 계속 시키는 아기는 같은 재료를 반복해서 먹게 돼요.</p>'
      + '<div class="dup-list">'
      + dups.map(d =>
          '<div class="dup-item"><span class="dup-type t-' + d.type + '">' + d.typeName + '</span>'
          + '<b>' + escapeDup(d.ingredient) + '</b>'
          + '<span class="dup-days">' + d.days.join(' · ') + '요일</span></div>'
        ).join('')
      + '</div>'
      + '<div class="dup-btns">'
      + '<button type="button" class="dup-fix">수정하기</button>'
      + '<button type="button" class="dup-go">그대로 저장하기</button>'
      + '</div></div>';
    const done = (v) => { wrap.remove(); resolve(v); };
    wrap.querySelector('.dup-fix').onclick = () => done(false);
    wrap.querySelector('.dup-go').onclick = () => done(true);
    wrap.onclick = (e) => { if (e.target === wrap) done(false); }; // 바깥 누르면 수정하기와 동일
    document.body.appendChild(wrap);
    wrap.querySelector('.dup-fix').focus();
  });
}
function escapeDup(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function saveMenu() {
  if (!currentMenu) { showToast('⚠️ 먼저 메뉴를 생성해주세요'); return; }
  const weekKey = document.getElementById('weekStart').value;


  // 재료 개수·단백질 겹침을 먼저 본다 — 구성 자체가 이상하면 중복보다 이게 먼저다
  const heavy = findHeavyMenus();
  if (heavy.length > 0) {
    const goOn = await confirmHeavyMenus(heavy);
    if (!goOn) { showToast('메뉴를 고친 뒤 다시 저장해주세요'); return; }
  }

  // 저장 직전에 재료 중복을 알려준다. '수정하기'를 고르면 저장하지 않고 화면에 강조 표시.
  const dups = findTypeDuplicates();
  if (dups.length > 0) {
    const goOn = await confirmDuplicates(dups);
    if (!goOn) {
      _dupSet = new Set(dups.map(d => d.ingredient));
      _conflictMode = true;
      renderMenu();
      const cb = document.getElementById('conflictBtn');
      if (cb) cb.classList.add('active');
      showToast('중복 재료를 강조했어요 — 고친 뒤 다시 저장해주세요');
      return;
    }
  }

  const alreadySaved = await isWeekSaved(weekKey);
  if (alreadySaved) {
    if (!confirm(`이미 저장된 주차예요.\n다시 저장하면 기존 기록이 바뀝니다.\n\n저장할까요?`)) return;
  }

  showToast('⏳ 저장 중...');
  await recordThisWeek(weekKey, currentMenu);
  _isDirty = false;
  persistCurrent();
  document.getElementById('bottomInfo').textContent =
    `✅ ${weekKey} 저장 완료`;
  showToast('💾 저장됐어요!');
}

// 해당 주차가 이미 서버에 저장됐는지 확인
async function isWeekSaved(weekKey) {
  if (!weekKey) return false;
  try {
    const res = await fetch(`${SB_URL}/rest/v1/kkakung_history?id=eq.${weekKey}&select=yusik`, {
      headers: SB_HEADERS
    });
    if (!res.ok) return false;
    const rows = await res.json();
    return rows.length > 0 && !!(rows[0].yusik && rows[0].yusik.schedule);
  } catch(e) { return false; }
}

// ===== 중복 확인 =====
let _conflictMode = false;
let _dupSet = new Set();

function highlightIngreds(str) {
  if (!_conflictMode || _dupSet.size === 0) return str;
  return str.split(',').map(part => {
    const t = part.trim();
    if (_dupSet.has(t)) return ` <mark style="background:#FFE066;border-radius:3px;padding:0 3px;font-weight:700">${t}</mark>`;
    return part;
  }).join(',');
}

function checkConflicts() {
  if (!currentMenu) { showToast('⚠️ 먼저 메뉴를 생성해주세요'); return; }

  if (_conflictMode) {
    _conflictMode = false;
    _dupSet.clear();
    renderMenu();
    document.getElementById('conflictBtn').classList.remove('active');
    return;
  }

  const all = [];
  currentMenu.forEach(day => {
    if (day.type === 'yushik') {
      day.menus.forEach(m => {
        m.ingredients.split(',').forEach(i => { const t = i.trim(); if (t) all.push(t); });
      });
    }
  });

  const exempt = new Set(['양파','채소상탕','한우육수','닭육수','당근','채소육수','한우','닭가슴살','닭','양파','소금','채소육수','']);
  const counts = {};
  all.forEach(i => { if (!exempt.has(i)) counts[i] = (counts[i]||0)+1; });
  const dups = Object.entries(counts).filter(([k,v]) => v > 1);

  if (dups.length === 0) { showToast('✅ 이번 주 재료 중복 없음!'); return; }

  _dupSet = new Set(dups.map(d => d[0]));
  _conflictMode = true;
  renderMenu();
  document.getElementById('conflictBtn').classList.add('active');
  showToast(`⚠️ 중복 재료 ${dups.length}개 강조 표시됨`);
}

// ===== 히스토리 보기 =====
function fmtWeekLabel(weekKey) {
  const m = weekKey.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return weekKey;
  // 년도 제거, 월/일만 표시
  return `${parseInt(m[2])}/${parseInt(m[3])} 주`;
}

function quickSelectWeek(wk) {
  document.getElementById('historyWeekSelect').value = '';
  // 가짜 select에 임시로 값 넣어 renderSelectedWeek 재사용
  const sel = document.getElementById('historyWeekSelect');
  // option이 없으면 임시 추가
  if (!Array.from(sel.options).some(o => o.value === wk)) {
    const opt = document.createElement('option');
    opt.value = wk; opt.style.display = 'none';
    sel.appendChild(opt);

      b.style.background = '#fff';

const DOW_NAMES = ['일','월','화','수','목','금','토'];
function fmtDayLabel(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return dateStr;
  const m = d.getMonth() + 1, day = d.getDate(), dow = DOW_NAMES[d.getDay()];
  return `${m}/${day} (${dow})`;
}
function typeLabel(t) { return t === 'hanwoo' ? '한우' : t === 'chicken' ? '닭' : '기타'; }
function typeBg(t)    { return t === 'hanwoo' ? '#ffe8d8' : t === 'chicken' ? '#fff5d8' : '#e8f4d8'; }
function typeColor(t) { return t === 'hanwoo' ? '#a04830' : t === 'chicken' ? '#8a7020' : '#3a7030'; }

// 일별 카드 렌더 (비교 뷰용)
function highlightDupes(ingStr, dupeSet) {
  if (!dupeSet || !dupeSet.size) return ingStr;
  return ingStr.split(',').map(part => {
    const t = part.trim();
    return dupeSet.has(t)
      ? ` <span style="color:#b84a1a;font-weight:800;text-decoration:underline">${t}</span>`
      : part;
  }).join(',');
}

}

function renderSelectedWeek() {
  if (!_historyData) { document.getElementById('historyContent').innerHTML = '<p style="color:#c44">먼저 히스토리를 불러와주세요.</p>'; return; }
  const wk = document.getElementById('historyWeekSelect').value;
  if (!wk) return;
  const w = _historyData.yusik.find(x => x.weekKey === wk);
  const veg = _historyData.yushik_veggie.find(x => x.weekKey === wk) || {hanwoo:[],chicken:[],p3:[]};
  if (!w) { document.getElementById('historyContent').innerHTML = '<p style="color:#c44">데이터를 찾을 수 없어요.</p>'; return; }

  // 좌우 비교: 왼쪽 = 직전 주(전주), 오른쪽 = 선택한 주(이번/최근)
  const thisSchedule = (w.schedule && Array.isArray(w.schedule)) ? w.schedule : null;
  const allSorted = [..._historyData.yusik].sort((a, b) => a.weekKey.localeCompare(b.weekKey));
  const selectedIdx = allSorted.findIndex(x => x.weekKey === wk);
  const prevInDb = selectedIdx > 0 ? allSorted[selectedIdx - 1] : null;
  const prevSchedule = prevInDb?.schedule && Array.isArray(prevInDb.schedule) ? prevInDb.schedule : null;

  const hasComparison = thisSchedule && thisSchedule.length && prevSchedule && prevSchedule.length;

  let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;">`;
  html += `<strong style="font-size:14px">📖 ${fmtWeekLabel(wk)}</strong>`;
  html += `<button class="btn btn-ghost" onclick="exitHistoryView()" style="padding:5px 12px;font-size:11px">✕ 닫기</button>`;
  html += `</div>`;

  if (hasComparison) {
    html += `<button class="btn btn-ghost" onclick="checkHistoryDupes()" style="width:100%;margin-bottom:10px;font-size:12px;background:rgba(122,36,24,0.08);border:1px solid rgba(122,36,24,0.35);color:var(--primary);font-weight:600">🔍 전주 vs 이번 주 재료 중복 확인</button>`;
    html += `<div id="histDupeResult" style="margin-bottom:10px"></div>`;
    const maxLen = Math.max(prevSchedule.length, thisSchedule.length);
    html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">`;
    html += `<div style="text-align:center;font-size:11px;font-weight:700;padding:6px;background:#f0eae0;border-radius:5px;color:var(--text)">전주 ${fmtWeekLabel(prevInDb.weekKey)}</div>`;
    html += `<div style="text-align:center;font-size:11px;font-weight:700;padding:6px;background:rgba(139,170,124,0.18);border-radius:5px;color:var(--text)">이번 주 ${fmtWeekLabel(wk)}</div>`;
    html += `</div>`;
    html += `<div id="histCompareGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">`;
    for (let i = 0; i < maxLen; i++) {
      html += renderDayCard(prevSchedule[i], '#fdfaf3');
      // 오른쪽: currentMenu 있으면 편집 가능 카드, 없으면 저장된 schedule
      const curDay = currentMenu && currentMenu[i];
      html += curDay
        ? renderEditableDayCard(curDay, i, 'rgba(139,170,124,0.06)')
        : renderDayCard(thisSchedule[i], 'rgba(139,170,124,0.06)');
    }
    html += `</div>`;
    document.getElementById('historyContent').innerHTML = html;
    window._histCompare = { prevSchedule, thisSchedule };
    window._histCompareActive = true;
    // menuContainer 숨김 (이번주 메뉴는 오른쪽에서 직접 편집)
    document.getElementById('menuContainer').style.display = 'none';
    return;
  }

  // schedule 있으면 단일 (이번 주 메뉴 없음 시)
  if (w.schedule && Array.isArray(w.schedule) && w.schedule.length) {
    // schedule 있으면 요일별 카드로 정확히 표시
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;">';
    w.schedule.forEach(day => {
      const dayLabel = fmtDayLabel(day.date);
      html += `<div style="background:white;border:1px solid var(--border);border-radius:10px;padding:12px;">`;
      html += `<div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);">${dayLabel}</div>`;
      if (day.type === 'yusik' && day.items) {
        html += `<div style="font-size:10px;color:var(--text-light);font-weight:700;margin-bottom:4px">🍲 유아식</div>`;
        day.items.forEach((it, i) => {
          html += `<div style="margin-bottom:8px;padding:6px 8px;background:#fafafa;border-radius:6px">`;
          html += `<div style="font-size:12px;font-weight:600;color:var(--text);margin-bottom:2px">${i+1}. ${it.name}</div>`;
          html += `<div style="font-size:10px;color:var(--text-light);line-height:1.5">${it.ingredients||''}</div>`;
          html += '</div>';
        });
      } else if (day.type === 'yushik' && day.menus) {
        html += `<div style="font-size:10px;color:var(--text-light);font-weight:700;margin-bottom:4px">🥄 이유식</div>`;
        day.menus.forEach((m, i) => {
          html += `<div style="margin-bottom:8px;padding:6px 8px;background:#fafafa;border-radius:6px">`;
          const _ing = normalizeYushikIngredients(m.ingredients||'', m.type);
          if (_ing) html += `<div style="font-size:12px;font-weight:700;color:var(--text);line-height:1.5;margin-bottom:2px">${_ing}</div>`;
          if (midNoteOf(m)) html += `<div style="font-size:10px;color:#b84a1a;font-weight:600">⚠️ 중기: ${midNoteOf(m)}</div>`;
          html += '</div>';
        });
      }
      html += '</div>';
    });
    html += '</div>';
  } else {
    // schedule 없는 옛 형식 — 저장된 데이터 그대로 복원 (요일 정보 없음)
    if (w.menus && w.menus.length) {
      html += `<div style="font-size:12px;font-weight:700;margin-bottom:6px;color:var(--text)">🍲 유아식 반찬 <span style="color:var(--text-light);font-weight:400">(${w.menus.length}개)</span></div>`;
      html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-bottom:14px">';
      w.menus.forEach(m => {
        html += `<div style="padding:10px 12px;background:white;border:1px solid var(--border);border-radius:8px">`;
        html += `<div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px">${m.name}</div>`;
        if (m.ingredients) html += `<div style="font-size:11px;color:var(--text-light);line-height:1.5">${m.ingredients}</div>`;
        html += '</div>';
      });
      html += '</div>';
    }

    // 이유식 — 저장된 콤보 그대로 + 표준 ingredients 재구성
    const buildYushikMenu = (combo, type) => {
      const [main, sub] = (combo || '').split('|');
      // 단백질 + 콤보 재료만 넣음. 고정 재료(육수·양파·채소상탕·당근) 인위 추가 안 함.
      const parts = type === 'hanwoo'  ? ['한우', main, sub]
                  : type === 'chicken' ? ['닭가슴살', main, sub]
                  :                      [main, sub];
      const raw = parts.filter(Boolean).join(', ');
      const name = type === 'hanwoo'  ? `한우 ${main||''}`.trim()
                 : type === 'chicken' ? `닭가슴살 ${main||''}`.trim()
                 :                      `${main||''}${sub?' '+sub:''}`.trim();
      return { name, ingredients: normalizeYushikIngredients(raw, type), type };
    };
    // 동일 이름 중복 제거
    const seen = new Set();
    const yushikMenus = [];
    const addMenu = (m) => { if (!seen.has(m.name)) { seen.add(m.name); yushikMenus.push(m); } };
    (veg.hanwoo || []).forEach(c => addMenu(buildYushikMenu(c, 'hanwoo')));
    (veg.chicken || []).forEach(c => addMenu(buildYushikMenu(c, 'chicken')));
    (veg.p3 || []).forEach(c => addMenu(buildYushikMenu(c, 'other')));

    if (yushikMenus.length) {
      html += `<div style="font-size:12px;font-weight:700;margin-bottom:6px;color:var(--text)">🥄 이유식 메뉴 <span style="color:var(--text-light);font-weight:400">(${yushikMenus.length}개)</span></div>`;
      html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px">';
      yushikMenus.forEach(m => {
        html += `<div style="padding:10px 12px;background:white;border:1px solid var(--border);border-radius:8px">`;
        html += `<div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px">${m.name}</div>`;
        html += `<div style="font-size:11px;color:var(--text-light);line-height:1.5">${m.ingredients}</div>`;
        html += '</div>';
      });
      html += '</div>';
    }
  }

  document.getElementById('historyContent').innerHTML = html;
}

// 겹치는 재료별 색상 팔레트
// 중복 재료 색상 — 밝은 배경에 진한 텍스트 (흰 배경에서도 잘 보이게)
const DUPE_COLORS = [
  {text:'#c82010'},  // 빨강
  {text:'#0070cc'},  // 파랑
  {text:'#107a10'},  // 초록
  {text:'#7a0090'},  // 보라
  {text:'#cc7000'},  // 주황
  {text:'#007a7a'},  // 청록
  {text:'#cc0060'},  // 핑크
  {text:'#705000'},  // 갈색
];

function highlightDupes(ingStr, dupeSet, dupeColorMap) {
  if (!dupeSet || !dupeSet.size) return ingStr;
  return ingStr.split(',').map(part => {
    const t = part.trim();
    if (!dupeSet.has(t)) return part;
    const c = dupeColorMap ? dupeColorMap[t] : null;
    const color = c ? c.text : '#b84a1a';
    return ` <span style="color:${color};font-weight:800">${t}</span>`;
  }).join(',');
}

function checkHistoryDupes() {
  // 이번 주 메뉴 없으면 중단
  if (!currentMenu) { showToast('⚠️ 먼저 메뉴를 생성해주세요'); return; }

  const data = window._histCompare;
  const EXCLUDE = new Set(['한우','닭가슴살','닭고기','한우육수','닭육수','양파','채소상탕','당근','소금','물']);

  function extractYushikIngreds(schedule) {
    const set = new Set();
    (schedule || []).forEach(day => {
      if (day.type !== 'yushik') return;
      (day.menus || []).forEach(m => {
        normalizeYushikIngredients(m.ingredients||'', m.type)
          .split(',').map(s=>s.trim()).filter(Boolean)
          .forEach(x => { if (!EXCLUDE.has(x)) set.add(x); });
      });
    });
    return set;
  }

  // ① 이번 주 내 중복 (같은 재료 2일 이상 등장)
  const weekIngCounts = {};
  (currentMenu || []).forEach(day => {
    if (day.type !== 'yushik') return;
    (day.menus || []).forEach(m => {
      normalizeYushikIngredients(m.ingredients||'', m.type)
        .split(',').map(s=>s.trim()).filter(Boolean)
        .forEach(x => { if (!EXCLUDE.has(x)) weekIngCounts[x] = (weekIngCounts[x]||0)+1; });
    });
  });
  const intraWeekDupes = new Set(Object.entries(weekIngCounts).filter(([,v])=>v>1).map(([k])=>k));

  // ② 전주 vs 이번 주 (비교 모드일 때만)
  let crossWeekDupes = new Set();
  if (data) {
    const prev = extractYushikIngreds(data.prevSchedule);
    const cur  = extractYushikIngreds(currentMenu);
    crossWeekDupes = new Set([...prev].filter(x => cur.has(x)));
  }

  // 합산 dupeSet
  const allDupes = new Set([...intraWeekDupes, ...crossWeekDupes]);
  const dupeColorMap = {};
  [...allDupes].forEach((d, i) => { dupeColorMap[d] = DUPE_COLORS[i % DUPE_COLORS.length]; });
  window._histLastDupeSet = allDupes;
  window._histDupeColorMap = dupeColorMap;

  // 상단 요약
  const el = document.getElementById('histDupeResult');
  if (el) {
    if (!allDupes.size) {
      el.innerHTML = `<div style="padding:8px 12px;background:rgba(139,170,124,0.12);border:1px solid rgba(139,170,124,0.4);border-radius:8px;font-size:12px;color:#3a7030;font-weight:600">✅ 중복 재료 없음</div>`;
    } else {
      const parts = [];
      if (intraWeekDupes.size) parts.push(`이번 주 내 ${intraWeekDupes.size}개`);
      if (crossWeekDupes.size) parts.push(`전주 겹침 ${crossWeekDupes.size}개`);
      const chipList = [...allDupes].map(d => `<span style="color:${dupeColorMap[d].text};font-weight:800">${d}</span>`).join(', ');
      el.innerHTML = `<div style="padding:8px 12px;background:rgba(255,214,204,0.2);border:1px solid rgba(255,140,105,0.4);border-radius:8px;font-size:11px;color:#7a2010;font-weight:600">⚠️ ${parts.join(' / ')}: ${chipList}</div>`;
    }
  }

  // 카드 재렌더링
  if (data && document.getElementById('histCompareGrid')) {
    const grid = document.getElementById('histCompareGrid');
    const rightSchedule = currentMenu;
    const maxLen = Math.max(data.prevSchedule.length, rightSchedule.length);
    let html = '';
    for (let i = 0; i < maxLen; i++) {
      html += renderDayCard(data.prevSchedule[i], '#fdfaf3', allDupes, dupeColorMap);
      html += renderEditableDayCard(rightSchedule[i], i, 'rgba(139,170,124,0.06)', allDupes, dupeColorMap);
    }
    grid.innerHTML = html;
  } else {
    // 단독 모드: 이번 주 카드 재렌더
    renderCurrentInHistory();
    // historyContent 내 카드들 재렌더 (dupeSet 적용)
    // TODO: 단독 모드에서 dupeSet 적용은 renderCurrentInHistory 확장 필요
  }
}

// ===== 이미지 다운로드 =====
const IMAGE_API = '/api/menu-image';

async function downloadImages() {
  if (!currentMenu) { showToast('⚠️ 먼저 메뉴를 생성해주세요'); return; }

  const btn = document.getElementById('downloadBtn');
  btn.textContent = '⏳ 생성 중...';
  btn.disabled = true;

  try {
    let downloaded = 0;
    for (const day of currentMenu) {
      let payload;

      if (day.type === 'yushik') {
        // 이유식 - 3개 메뉴에서 이름/재료 추출
        const menus = day.menus.map(m => ({
          name: (m.displayName || m.name).replace(' 죽/무른밥/진밥',''),
          // 인쇄물에 "중기: 새우 제외"가 빠져서 그냥 나가던 문제 — 이미지에도 함께 넘긴다
          mid_note: midNoteOf(m),
          ingred: m.ingredients.split(',').map(s => s.trim()).reduce((acc, _, i, arr) => {
            if (i % 2 === 0) acc.push(arr.slice(i, i+2).join(', '));
            return acc;
          }, [])
        }));

        // 원산지 자동 생성 (재료에서 추출)
        const allIngred = day.menus.flatMap(m =>
          m.ingredients.split(',').map(s => s.trim()).filter(s => s && !['양파','채소상탕','한우육수','닭육수'].includes(s))
        );
        // 직접 입력한 원산지 사용 (없으면 자동생성)
        const origins = day.origins || [...new Set(allIngred)].map(i => i + '국내산').join(', ');

        payload = {
          type: 'yushik',
          date_str: formatKorDate(day.date),
          menus,
          origins
        };
      } else {
        // 유아식 - 각 item의 origin 직접 사용
        const items = day.items.map(item => ({
          name: item.name,
          ingred: item.ingredients.split(',').map(s => s.trim()).reduce((acc, _, i, arr) => {
            if (i % 2 === 0) acc.push(arr.slice(i, i+2).join(', '));
            return acc;
          }, []),
          origin: item.origin || ''
        }));

        const soupIngred = day.soup.ingredients.split(',').map(s => s.trim());

        // 원산지: 각 item.origin 합치기
        const allOrigins = [
          ...day.items.map(i => i.origin).filter(Boolean),
          day.soup.origin || ''
        ].filter(Boolean).join(', ');

        payload = {
          type: 'yusik',
          date_str: formatKorDate(day.date),
          items,
          soup: {
            name: day.soup.name,
            ingred: soupIngred.reduce((acc, _, i, arr) => {
              if (i % 2 === 0) acc.push(arr.slice(i, i+2).join(', '));
              return acc;
            }, []),
            origin: day.soup.origin || ''
          },
          origins: allOrigins,
          notes: [
            '아이마다 좋아하는 맛과 속도가 달라 모든 메뉴가 항상 잘 맞지 않을 수 있습니다.',
            '알레르기나 조정이 필요한 재료는 주문 시 편하게 말씀 주세요.',
            '주문은 일요일 저녁 10시까지 부탁드립니다.',
            '까꿍디미방은 재료 궁합을 고려해 식단을 구성하고, 친환경 재료를 사용해 정성스럽게 조리합니다.',
          ]
        };
      }

      const res = await fetch(IMAGE_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!res.ok) throw new Error(`API 오류: ${res.status}`);

      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const typeLabel = day.type === 'yushik' ? '이유식' : '유아식';
      a.href = url;
      a.download = `까꿍디미방_${typeLabel}_${formatKorDate(day.date)}.png`;
      a.click();
      URL.revokeObjectURL(url);
      downloaded++;

      // 연속 다운로드 간격
      await new Promise(r => setTimeout(r, 500));
    }

    showToast(`✅ ${downloaded}개 이미지 다운로드 완료!`);
  } catch (e) {
    showToast(`❌ 오류: ${e.message}`);
    console.error(e);
  } finally {
    btn.textContent = '🖼️ 이미지 다운로드';
    btn.disabled = false;
  }
}

  const FORG = {'파로':'이탈리아','아보카도':'페루','아마란스':'페루','퀴노아':'페루','단호박':'뉴질랜드','렌틸콩':'캐나다','오트밀':'캐나다','햄프시드':'캐나다','흰강낭콩':'캐나다','테프':'에티오피아','연어':'노르웨이','캐슈넛':'베트남','치아씨드':'멕시코','소고기':'호주','황태':'러시아','대구살':'원양','모짜렐라치즈':'이탈리아','병아리콩':'이집트'};

  // 칸 아래 얇은 영양 한 줄. 열량·단백질·철만 — 칼슘은 낮게 나와 설명이 필요해서 아래 안내로 뺐다.
  function nutLine(m, stage) {
    if (!withNut) return '';
    let f;
    try { f = nutritionFacts(m, stage, 230); } catch (e) { return ''; }
    if (!f || !f.values) return '';
    const [kcal, , prot, , , iron] = f.values;
    if (!kcal) return '';
    return '<div style="border-top:1px dashed #d0d0d0;background:#fbfdfa;padding:5px 2px;font-size:10.5px;color:#6f8069;text-align:center;letter-spacing:-.2px;">'
      + kcal + 'kcal &nbsp;·&nbsp; 단백질 ' + prot + 'g &nbsp;·&nbsp; 철 ' + iron + 'mg'
      + '</div>';
  }

  // 손님이 숫자만 보고 놀라지 않으시게 붙이는 안내
  const nutBox = '<div style="border:1px solid #e0f0d8;border-radius:6px;background:#f7fcf5;padding:2.5mm 5mm;margin-top:3mm;font-size:11px;line-height:1.85;color:#5f6f5a;text-align:center;word-break:keep-all;">'
    + '<span style="font-weight:700;color:#7aaa68;letter-spacing:.1em;">— 영양성분 안내 (참고용) —</span><br>'

    + '단백질 비율이 높아 보이는 것은 아기 권장량이 원래 작기 때문이고, '
    + '칼슘이 낮은 것은 이 시기 칼슘을 대부분 분유·모유에서 채우기 때문이라 정상입니다.'
    + '</div>';

  function buildTitle(m) {
    const sfxIng = ['양파','채소상탕','한우육수','닭육수'];
    const ings = (m.ingredients||'').split(',').map(s=>s.trim()).filter(Boolean);
    const main = ings.filter(s=>!sfxIng.includes(s));
    if (m.type==='hanwoo') {
      const v = main.find(s=>s!=='한우')||'';
      return v ? '한우 '+v : '한우';
    }
    if (m.type==='chicken') {
      const v = main.find(s=>s!=='닭가슴살')||'';
      return v ? '닭가슴살 '+v : '닭가슴살';
    }
    // 기타단백질: P3_POOL → displayName 첫 단어 → main[0] 순으로 주재료 파악
    const p3Set = new Set(P3_POOL);
    const fromPool = main.find(s=>p3Set.has(s));
    const fromName = (m.displayName||m.name||'').replace(/\s*(죽|무른밥|진밥)(\/무른밥\/진밥)?$/,'').trim().split(/\s+/)[0];
    const mainProt = fromPool || (fromName && main.includes(fromName) ? fromName : '') || main[0] || '';
    const veggie = main.find(s=>s!==mainProt) || '';
    return mainProt + (veggie ? ' '+veggie : '');
  }

  function sortI(ingStr, menuName, mtype) {
    const sfx = TYPE_SFX[mtype] || ['양파','채소상탕'];
    let p = ingStr.split(',').map(s=>s.trim()).filter(Boolean);
    sfx.forEach(s => { if (!p.includes(s)) p.push(s); });
    const body = p.filter(s => !sfx.includes(s));
    const nToks = (menuName||'').replace(/\s*(죽|무른밥|진밥).*$/,'').trim().split(/\s+/);
    const ord = [];
    nToks.forEach(t => { const f=body.find(b=>b===t||b.startsWith(t)||t.startsWith(b)); if(f&&!ord.includes(f)) ord.push(f); });
    body.forEach(b => { if (!ord.includes(b)) ord.push(b); });
    return [...ord, ...sfx];
  }

  function fmtI(ingStr, mtype, menuName) {
    const p = sortI(ingStr, menuName||'', mtype);
    const lines=[]; for(let i=0;i<p.length;i+=2) lines.push(p.slice(i,i+2).join(', '));
    return lines.map(l=>'<div>'+l+'</div>').join('');
  }

  function buildOri(menus) {
    const seen=new Set(), res=[];
    (menus||[]).forEach(m => {
      const ord = sortI(m.ingredients||'', m.displayName||m.name||'', m.type);
      ord.filter(s=>!SFXALL.includes(s)).slice(0,3).forEach(s => {
        if (!seen.has(s)) { seen.add(s); res.push(s+(FORG[s]||'국내산')); }
      });
    });
    return res.join(', ');
  }

      +'<span contenteditable="true" spellcheck="false" class="gm"'+pe()+' style="font-size:18px;font-weight:700;letter-spacing:.04em;color:#3a703a;">까꿍 디미방 '+dt+' 이유식 메뉴표</span>'

      +'<th colspan="3" class="gm" style="background:#82bc78;color:#fff;font-size:13px;font-weight:700;padding:7px 4px;border:1px solid #c0e8a8;">메 &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;뉴</th>'
      +'</tr></thead>'

      +(withNut ? nutBox : '')

    const natBox = '<div style="border:1px solid #e0f0d8;border-radius:8px;background:#f7fcf5;padding:9mm 10mm;text-align:center;font-size:15px;font-weight:600;line-height:2.5;color:#444;margin-top:5mm;">'

    return '<div style="display:flex;flex-direction:column;height:281mm;">'

      +(()=>{const sAll=[...sNonS,...sSfx];if(sAll.length>=5){const m=Math.ceil(sAll.length/2);return'<div>( '+sAll.slice(0,m).join(', ')+',</div><div>'+sAll.slice(m).join(', ')+' )</div>';}return'<div>( '+sAll.join(', ')+' )</div>';})()

  const natPage = '<div class="a4p"><div style="border:2px solid #bbb;border-radius:4px;padding:20mm 16mm;text-align:center;font-size:18px;font-weight:700;line-height:2.3;color:#222;">'

    +'실제 한 끼에 섭취하는 나트륨 양은 이보다 더 낮아집니다.'
    +'</div></div>';

  const yushikDays = allDays.filter(d => d.type==='yushik' && (d.menus||[]).length > 0);
  const yusikDays  = allDays.filter(d => d.type==='yusik' && (d.items||[]).length > 0);
  let pages = '';
  // 영양성분판은 칸마다 수치가 붙고 안내문도 들어가서 2일치를 한 장에 넣으면 넘친다.

  const html = '<!DOCTYPE html><html lang="ko"><head>'
    +'<meta charset="UTF-8"><title>까꿍디미방 메뉴표</title>'
    +'<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">'

    +'@font-face{font-family:"GmarketSans";font-weight:700;src:url("https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff") format("woff");}'

// ===== PDF 다운로드 (이미지 한 장 = PDF 한 페이지) =====
async function downloadPDF() {
  if (!currentMenu) { showToast('⚠️ 먼저 메뉴를 생성해주세요'); return; }

  const btn = document.getElementById('pdfBtn');
  btn.textContent = '⏳ PDF 생성 중...';
  btn.disabled = true;

  try {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const pageW = 210, pageH = 297;
    let isFirst = true;

    for (const day of currentMenu) {
      let payload;
      if (day.type === 'yushik') {
        const menus = day.menus.map(m => ({
          name: (m.displayName || m.name).replace(' 죽/무른밥/진밥',''),
          mid_note: midNoteOf(m),
          ingred: m.ingredients.split(',').map(s => s.trim()).reduce((acc, _, i, arr) => {
            if (i % 2 === 0) acc.push(arr.slice(i, i+2).join(', ')); return acc;
          }, [])
        }));
        const allIngred = day.menus.flatMap(m =>
          m.ingredients.split(',').map(s => s.trim()).filter(s => s && !['양파','채소상탕','한우육수','닭육수'].includes(s))
        );
        const pdfOrigins = day.origins || [...new Set(allIngred)].map(i => i+'국내산').join(', ');
        payload = { type: 'yushik', date_str: formatKorDate(day.date), menus, origins: pdfOrigins };
      } else {
        const items = day.items.map(item => ({
          name: item.name,
          ingred: item.ingredients.split(',').map(s => s.trim()).reduce((acc, _, i, arr) => {
            if (i % 2 === 0) acc.push(arr.slice(i, i+2).join(', ')); return acc;
          }, []),
          origin: item.origin || ''
        }));
        payload = {
          type: 'yusik', date_str: formatKorDate(day.date), items,
          soup: { name: day.soup.name, ingred: day.soup.ingredients.split(',').map(s=>s.trim()).reduce((acc,_,i,arr)=>{ if(i%2===0)acc.push(arr.slice(i,i+2).join(', ')); return acc; },[]), origin: day.soup.origin||'' },
          origins: [...day.items.map(i=>i.origin), day.soup.origin||''].filter(Boolean).join(', '),
          notes: ['아이마다 좋아하는 맛과 속도가 달라 모든 메뉴가 항상 잘 맞지 않을 수 있습니다.','알레르기나 조정이 필요한 재료는 주문 시 편하게 말씀 주세요.','주문은 일요일 저녁 10시까지 부탁드립니다.','까꿍디미방은 재료 궁합을 고려해 식단을 구성하고, 친환경 재료를 사용해 정성스럽게 조리합니다.']
        };
      }

      const res = await fetch(IMAGE_API, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
      if (!res.ok) throw new Error(`API 오류: ${res.status}`);

      const blob = await res.blob();

      // Blob → base64 data URL
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });

      // 이미지 원본 크기 확인 후 A4에 맞게 비율 조정
      const img = new Image();
      await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = dataUrl; });
      const ratio = Math.min(pageW / img.width, pageH / img.height);
      const w = img.width * ratio;
      const h = img.height * ratio;
      const x = (pageW - w) / 2;
      const y = (pageH - h) / 2;

      if (!isFirst) pdf.addPage();
      pdf.addImage(dataUrl, 'PNG', x, y, w, h);
      isFirst = false;

      await new Promise(r => setTimeout(r, 300));
    }

    const today = new Date().toLocaleDateString('ko-KR').replace(/\. /g,'-').replace('.','');
    pdf.save(`까꿍디미방_이유식메뉴표_${today}.pdf`);
    showToast(`✅ PDF 다운로드 완료! (${currentMenu.length}페이지)`);
  } catch (e) {
    showToast(`❌ PDF 오류: ${e.message}`);
    console.error(e);
  } finally {
    btn.textContent = '📄 PDF 다운로드';
    btn.disabled = false;
  }
}

// ⚠️ 예전엔 토스트가 연달아 뜨면(예: "저장 중..." 다음에 바로 "저장됐어요") 각자 따로
// setTimeout을 걸어서, 먼저 뜬 토스트의 타이머가 나중 토스트를 조기에 숨겨버리는 경우가 있었음
// — 타이머를 하나만 유지해서 매번 이전 걸 취소하고 새로 걺.
let _toastTimer = null;
function showToast(msg, action) {
  const t = document.getElementById('toast');
  t.innerHTML = `<span>${msg}</span>` + (action
    ? `<button id="toastActionBtn" style="background:rgba(255,255,255,0.22);border:none;color:#fff;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;">${action.label}</button>`
    : '');
  if (action) document.getElementById('toastActionBtn').onclick = () => { action.onClick(); t.classList.remove('show'); };
  t.classList.add('show');
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), action ? 5000 : 2800);
}
